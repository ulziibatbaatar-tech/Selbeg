<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ухаалаг Excel Систем</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        /* Excel Хүснэгтийн үндсэн стайл */
        .excel-table {
            border-collapse: collapse;
            width: 100%;
        }
        .excel-table th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
            border: 1px solid #cbd5e1;
            padding: 8px 12px;
            font-size: 13px;
            text-align: left;
            user-select: none;
        }
        .excel-table td {
            border: 1px solid #cbd5e1;
            padding: 0;
            background-color: #ffffff;
            min-width: 120px;
        }
        .excel-table input {
            width: 100%;
            height: 100%;
            padding: 8px 12px;
            font-size: 13px;
            border: none;
            outline: none;
            background: transparent;
        }
        .excel-table input:focus {
            background-color: #f0fdf4; /* Ногоон туяатай идэвхтэй нүд */
            box-shadow: inset 0 0 0 2px #16a34a;
        }
        /* Мөрийн дугаарлах багана */
        .row-number {
            background-color: #f1f5f9 !important;
            color: #94a3b8;
            text-align: center !important;
            font-size: 11px;
            width: 40px;
            min-width: 40px !important;
            font-weight: normal;
            border: 1px solid #cbd5e1;
            user-select: none;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function RealExcelApp() {
          // Одоогийн идэвхтэй байгаа Sheet (Хуудас)
          const [currentSheet, setCurrentSheet] = useState('Сэлбэгийн агуулах');
          const [searchTerm, setSearchTerm] = useState('');

          // 1. СЭЛБЭГИЙН АГУУЛАХ (Sheet 1) - Багана бүрийг гараар чөлөөтэй өөрчилж болно
          const [warehouseHeaders, setWarehouseHeaders] = useState(['Барааны нэр', 'Материалын код', 'Орлого (Тоо)', 'Зарлага (Тоо)', 'Үлдэгдэл', 'Нийлүүлэгч / Тасаг']);
          const [warehouseData, setWarehouseData] = useState([
            ['Пүрш', 'SPR-001', '120', '20', '100', 'Блю Стар ХХК'],
            ['Боолт M10', 'BLT-010', '500', '50', '450', 'Техно Импекс'],
            ['LED гэрэл 50W', 'LED-050', '30', '0', '30', 'Электро Сервис'],
            ['Ажлын бээлий', 'GLV-002', '200', '15', '185', 'Дотоод Сорс'],
          ]);

          // 2. ХАБЭА БҮРТГЭЛ (Sheet 2) - Гарын үсэггүй, цэвэр хүснэгтэн дүрэм заавар
          const [hseHeaders, setHseHeaders] = useState(['Үйлдвэрийн зааварчилгааны сэдэв', 'Зааврын ангилал', 'Дотоод код', 'Хамаарах тасаг хэлтэс']);
          const [hseData, setHseData] = useState([
            ['Оёдолын машины аюулгүй ажиллагаа', 'Ерөнхий зааварчилгаа', 'HSE-001', 'Оёдолын тасаг'],
            ['Агуулахын өргөгч крантай ажиллах журам', 'Тусгай зааварчилгаа', 'HSE-002', 'Агуулах хэсэг'],
            ['Гал түймрийн аюулаас урьдчилан сэргийлэх', 'Гал унтраах заавар', 'HSE-003', 'Нийт ажилчид'],
          ]);

          // Автомат Үлдэгдэл бодох томьёо (Орлого - Зарлага = Үлдэгдэл)
          useEffect(() => {
            const updated = warehouseData.map(row => {
              const incoming = parseFloat(row[2]) || 0;
              const outgoing = parseFloat(row[3]) || 0;
              const remain = incoming - outgoing;
              const newRow = [...row];
              newRow[4] = remain.toString(); // 4 дэх индекс буюу Үлдэгдэл багана
              return newRow;
            });
            if (JSON.stringify(updated) !== JSON.stringify(warehouseData)) {
              setWarehouseData(updated);
            }
          }, [warehouseData]);

          // 📝 НҮДЭН ДЭЭР ДАРАЖ УТГА ӨӨРЧЛӨХ (Excel функц)
          const handleCellChange = (value, rowIndex, colIndex, sheetType) => {
            if (sheetType === 'warehouse') {
              const newData = [...warehouseData];
              newData[rowIndex][colIndex] = value;
              setWarehouseData(newData);
            } else {
              const newData = [...hseData];
              newData[rowIndex][colIndex] = value;
              setHseData(newData);
            }
          };

          // ➕ МӨР (ROW) НЭМЭХ
          const addRow = () => {
            if (currentSheet === 'Сэлбэгийн агуулах') {
              setWarehouseData([...warehouseData, Array(warehouseHeaders.length).fill('')]);
            } else if (currentSheet === 'ХАБЭА бүртгэл') {
              setHseData([...hseData, Array(hseHeaders.length).fill('')]);
            }
          };

          // ➖ МӨР (ROW) ХАСАХ
          const removeRow = () => {
            if (currentSheet === 'Сэлбэгийн агуулах') {
              if (warehouseData.length > 0) setWarehouseData(warehouseData.slice(0, -1));
            } else if (currentSheet === 'ХАБЭА бүртгэл') {
              if (hseData.length > 0) setHseData(hseData.slice(0, -1));
            }
          };

          // ➕ БАГАНА (COLUMN) НЭМЭХ
          const addColumn = () => {
            const colName = prompt("Шинэ баганын нэрийг оруулна уу:");
            if (!colName) return;

            if (currentSheet === 'Сэлбэгийн агуулах') {
              setWarehouseHeaders([...warehouseHeaders, colName]);
              setWarehouseData(warehouseData.map(row => [...row, '']));
            } else if (currentSheet === 'ХАБЭА бүртгэл') {
              setHseHeaders([...hseHeaders, colName]);
              setHseData(hseData.map(row => [...row, '']));
            }
          };

          // 📂 EXCEL / ODS ФАЙЛ УНШИЖ ШУУД ХҮСНЭГТ РҮҮ ХУУЛАХ
          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
              try {
                const bstr = evt.target.result;
                const wb = XLSX.read(bstr, { type: 'binary' });
                
                // Sheet 1: Агуулах
                if (wb.SheetNames.length > 0) {
                  const ws1 = wb.Sheets[wb.SheetNames[0]];
                  const data1 = XLSX.utils.sheet_to_json(ws1, { header: 1 });
                  if (data1.length > 0) {
                    setWarehouseHeaders(data1[0].map((h, i) => h || `Багана ${i+1}`));
                    setWarehouseData(data1.slice(1).filter(r => r.length > 0));
                  }
                }

                // Sheet 2: ХАБЭА
                if (wb.SheetNames.length > 1) {
                  const ws2 = wb.Sheets[wb.SheetNames[1]];
                  const data2 = XLSX.utils.sheet_to_json(ws2, { header: 1 });
                  if (data2.length > 0) {
                    setHseHeaders(data2[0].map((h, i) => h || `Багана ${i+1}`));
                    setHseData(data2.slice(1).filter(r => r.length > 0));
                  }
                }
                alert("Файлын Sheet-үүдийг амжилттай хүснэгтэд шилжүүллээ!");
              } catch (err) {
                alert("Файл уншихад алдаа гарлаа.");
              }
            };
            reader.readAsBinaryString(file);
          };

          // 💾 ШИНЭЧИЛСЭН EXCEL ФАЙЛ ТАТАЖ АВАХ
          const downloadExcel = () => {
            const wb = XLSX.utils.book_new();
            const ws1 = XLSX.utils.aoa_to_sheet([warehouseHeaders, ...warehouseData]);
            XLSX.utils.book_append_sheet(wb, ws1, "Сэлбэгийн агуулах");
            const ws2 = XLSX.utils.aoa_to_sheet([hseHeaders, ...hseData]);
            XLSX.utils.book_append_sheet(wb, ws2, "ХАБЭА бүртгэл");
            XLSX.writeFile(wb, "Best_Shoes_Агуулах_ХАБЭА.xlsx");
          };

          // Тооцоолуур (Тайлан хуудаст зориулав)
          const totalIn = warehouseData.reduce((s, r) => s + (parseFloat(r[2]) || 0), 0);
          const totalOut = warehouseData.reduce((s, r) => s + (parseFloat(r[3]) || 0), 0);
          const totalStock = warehouseData.reduce((s, r) => s + (parseFloat(r[4]) || 0), 0);

          // Хайлт шүүлт
          const filterData = (rows) => {
            if (!searchTerm.trim()) return rows;
            return rows.filter(row => 
              row.some(cell => cell?.toString().toLowerCase().includes(searchTerm.toLowerCase().trim()))
            );
          };

          return (
            <div className="min-h-screen flex flex-col bg-white select-text">
              
              {/* 1. ЭКСЕЛ ДЭЭД ЦЭС (Цагаан/Ногоон Ухаалаг Хэрэгсэл) */}
              <header className="bg-slate-100 border-b border-slate-300 p-3 flex flex-wrap items-center justify-between gap-4 shadow-xs">
                <div className="flex items-center gap-6">
                  <span className="font-black text-emerald-700 tracking-wider text-base">🟢 EXCEL ХЯНАЛТ</span>
                  <div className="flex gap-1.5 bg-slate-200/80 p-1 rounded-lg text-xs font-semibold">
                    <button onClick={addRow} className="bg-white text-slate-800 px-3 py-1.5 rounded border border-slate-300 hover:bg-slate-50 transition">➕ Мөр нэмэх</button>
                    <button onClick={removeRow} className="bg-white text-red-600 px-3 py-1.5 rounded border border-slate-300 hover:bg-red-50 transition">➖ Мөр хасах</button>
                    <button onClick={addColumn} className="bg-white text-slate-800 px-3 py-1.5 rounded border border-slate-300 hover:bg-slate-50 transition">📐 Багана нэмэх</button>
                  </div>
                </div>

                <div className="flex items-center gap-3">
                  <input 
                    type="text" 
                    placeholder="Хүснэгтээс хайх..." 
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="px-3 py-1.5 border border-slate-300 rounded bg-white text-xs outline-none focus:border-emerald-600 w-48 sm:w-64 shadow-inner"
                  />
                  <label className="bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-bold py-1.5 px-3 rounded cursor-pointer border border-slate-300 transition">
                    📁 Импорт (.ods / .xlsx)
                    <input type="file" accept=".xlsx, .xls, .ods" onChange={handleFileUpload} className="hidden" />
                  </label>
                  <button onClick={downloadExcel} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-1.5 px-3 rounded shadow transition">
                    💾 Excel татах
                  </button>
                </div>
              </header>

              {/* 2. EXCEL SHEET-ҮҮДИЙН ТАБ СОНГОЛТ (Яг дээд талд нь байрлана) */}
              <div className="bg-slate-200 border-b border-slate-300 flex items-center select-none text-xs font-medium">
                {['Сэлбэгийн агуулах', 'ХАБЭА бүртгэл', 'Бодит тайлан'].map((tab) => (
                  <button
                    key={tab}
                    onClick={() => setCurrentSheet(tab)}
                    className={`px-6 py-2.5 border-r border-slate-300 transition ${currentSheet === tab ? 'bg-white font-bold text-emerald-700 border-t-2 border-t-emerald-600 shadow-xs' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    📊 {tab}
                  </button>
                ))}
              </div>

              {/* 3. ХҮСНЭГТИЙН ТАЛБАР (Дэлгэц дүүрэн чөлөөтэй) */}
              <div className="flex-1 overflow-auto p-4 bg-slate-100">
                
                {/* Агуулахын хүснэгт */}
                {currentSheet === 'Сэлбэгийн агуулах' && (
                  <div className="bg-white shadow-sm border border-slate-300 rounded overflow-hidden">
                    <table className="excel-table">
                      <thead>
                        <tr>
                          <th className="row-number">№</th>
                          {warehouseHeaders.map((h, idx) => (
                            <th key={idx}>{h}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {filterData(warehouseData).map((row, rIdx) => (
                          <tr key={rIdx}>
                            <td className="row-number">{rIdx + 1}</td>
                            {row.map((cell, cIdx) => (
                              <td key={cIdx} className={cIdx === 4 ? "bg-slate-50 font-bold text-emerald-600" : ""}>
                                <input 
                                  type="text" 
                                  value={cell || ''} 
                                  disabled={cIdx === 4} // Үлдэгдэл баганыг автоматаар бодох тул цоожилно
                                  onChange={(e) => handleCellChange(e.target.value, rIdx, cIdx, 'warehouse')}
                                />
                              </td>
                            ))}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}

                {/* ХАБЭА бүртгэлийн хүснэгт */}
                {currentSheet === 'ХАБЭА бүртгэл' && (
                  <div className="bg-white shadow-sm border border-slate-300 rounded overflow-hidden">
                    <table className="excel-table">
                      <thead>
                        <tr>
                          <th className="row-number">№</th>
                          {hseHeaders.map((h, idx) => (
                            <th key={idx}>{h}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {filterData(hseData).map((row, rIdx) => (
                          <tr key={rIdx}>
                            <td className="row-number">{rIdx + 1}</td>
                            {row.map((cell, cIdx) => (
                              <td key={cIdx}>
                                <input 
                                  type="text" 
                                  value={cell || ''} 
                                  onChange={(e) => handleCellChange(e.target.value, rIdx, cIdx, 'hse')}
                                />
                              </td>
                            ))}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}

                {/* Бодит тайлан хэсэг */}
                {currentSheet === 'Бодит тайлан' && (
                  <div className="max-w-4xl mx-auto bg-white p-6 rounded-xl border border-slate-300 shadow-sm mt-4 space-y-6">
                    <h3 className="text-base font-bold text-slate-800 border-b pb-3">📈 Агуулахын нэгдсэн автомат тайлан</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                      <div className="p-4 bg-slate-50 border rounded-lg text-center">
                        <p className="text-xs font-semibold text-slate-500 uppercase">Нийт Орлогын Нийлбэр</p>
                        <h4 className="text-2xl font-bold text-blue-600 mt-2">{totalIn.toLocaleString()} ш</h4>
                      </div>
                      <div className="p-4 bg-slate-50 border rounded-lg text-center">
                        <p className="text-xs font-semibold text-slate-500 uppercase">Нийт Зарлагын Нийлбэр</p>
                        <h4 className="text-2xl font-bold text-orange-600 mt-2">{totalOut.toLocaleString()} ш</h4>
                      </div>
                      <div className="p-4 bg-emerald-50/50 border border-emerald-200 rounded-lg text-center">
                        <p className="text-xs font-semibold text-emerald-700 uppercase">Агуулахын Бодит Үлдэгдэл</p>
                        <h4 className="text-2xl font-bold text-emerald-700 mt-2">{totalStock.toLocaleString()} ш</h4>
                      </div>
                    </div>
                  </div>
                )}

              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RealExcelApp />);
    </script>
</body>
</html>
