<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ухаалаг Excel Агуулахын Систем</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        .excel-table th, .excel-table td {
            border: 1px solid #cbd5e1;
            padding: 4px 8px;
            font-size: 13px;
            white-space: nowrap;
        }
        .excel-table input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            padding: 2px;
        }
        .excel-table input:focus {
            background-color: #eff6ff;
            box-shadow: inset 0 0 0 2px #3b82f6;
        }
        .excel-table th input {
            font-weight: bold;
            text-align: center;
            color: #1e293b;
        }
    </style>
</head>
<body class="bg-slate-100">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function CleanExcelApp() {
          const [activeMenu, setActiveMenu] = useState('Агуулахын Бүртгэл');
          const [searchTerm, setSearchTerm] = useState('');

          // Хүснэгтийн баганын гарчгуудыг хүртэл өөрөө дарж засаж болдог болгов
          const [headers, setHeaders] = useState([
            'Барааны нэр (A)', 
            'Материалын код (B)', 
            'Орлогын тоо (C)', 
            'Зарлагын тоо (D)', 
            'Үлдэгдэл (E = C - D)', 
            'Тайлбар / Нийлүүлэгч (F)'
          ]);

          // Эхлэхдээ бэлэн хоосон 10 мөр хүснэгт үүсгэнэ (Жишээ датануудыг бүгдийг цэвэрлэв)
          const [gridData, setGridData] = useState(
            Array(10).fill(null).map(() => Array(6).fill(''))
          );

          // С, D баганыг ашиглан E (Үлдэгдэл) баганыг автоматаар бодох томьёо
          useEffect(() => {
            const updated = gridData.map(row => {
              const incoming = parseFloat(row[2]) || 0;
              const outgoing = parseFloat(row[3]) || 0;
              const remain = incoming - outgoing;
              
              const newRow = [...row];
              // Хэрэв Орлого эсвэл Зарлагын аль нэгэнд тоо орсон байвал Үлдэгдлийг бодно, үгүй бол хоосон байна
              if (row[2] !== '' || row[3] !== '') {
                newRow[4] = remain.toString();
              } else {
                newRow[4] = '';
              }
              return newRow;
            });

            if (JSON.stringify(updated) !== JSON.stringify(gridData)) {
              setGridData(updated);
            }
          }, [gridData]);

          // 📁 EXCEL ЭСВЭЛ ODS ФАЙЛ УНШИХ
          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
              try {
                const bstr = evt.target.result;
                const wb = XLSX.read(bstr, { type: 'binary' });
                const wsName = wb.SheetNames[0];
                const ws = wb.Sheets[wsName];
                const parsedData = XLSX.utils.sheet_to_json(ws, { header: 1 });
                
                if (parsedData.length > 0) {
                  // Эхний мөрийг гарчиг болгож авах
                  const newHeaders = parsedData[0].map((h, idx) => h || `Багана ${idx + 1}`);
                  // Хэрэв баганы тоо 6-аас бага бол 6 хүртэл гүйцээнэ
                  while (newHeaders.length < 6) newHeaders.push(`Багана ${newHeaders.length + 1}`);
                  setHeaders(newHeaders.slice(0, 6));

                  // Үлдсэн мөрүүдийг дата болгож авах
                  const newData = parsedData.slice(1).map(row => {
                    const r = [...row];
                    while (r.length < 6) r.push('');
                    return r.slice(0, 6);
                  });
                  
                  // Хэрэв файл 10-аас цөөн мөртэй бол хоосон мөр нэмж 10 болгоно
                  while (newData.length < 10) newData.push(Array(6).fill(''));
                  
                  setGridData(newData);
                  alert("Файлыг амжилттай уншиж хүснэгтэд хууллаа!");
                  setActiveMenu('Агуулахын Бүртгэл');
                }
              } catch (error) {
                alert("Файл уншихад алдаа гарлаа. Зөв формат эсэхийг шалгана уу.");
              }
            };
            reader.readAsBinaryString(file);
          };

          // 💾 EXCEL ФАЙЛ БОЛГОЖ БУЦААЖ ТАТАХ
          const exportToExcel = () => {
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet([headers, ...gridData]);
            XLSX.utils.book_append_sheet(wb, ws, "Агуулахын Тайлан");
            XLSX.writeFile(wb, "Best_Shoes_Агуулах.xlsx");
          };

          // 📝 НҮДНИЙ УТГА ӨӨРЧЛӨХ (Excel шиг шууд бичих)
          const handleCellChange = (value, rowIndex, colIndex) => {
            const newData = [...gridData];
            newData[rowIndex][colIndex] = value;
            setGridData(newData);
          };

          // 📝 БАГАНЫН ГАРЧИГ ӨӨРЧЛӨХ
          const handleHeaderChange = (value, colIndex) => {
            const newHeaders = [...headers];
            newHeaders[colIndex] = value;
            setHeaders(newHeaders);
          };

          // ➕ ШИНЭ МӨР НЭМЭХ
          const addRow = () => {
            setGridData([...gridData, Array(6).fill('')]);
          };

          // ➖ СҮҮЛИЙН МӨРИЙГ ХАСАХ
          const removeRow = () => {
            if (gridData.length > 1) {
              setGridData(gridData.slice(0, -1));
            }
          };

          // Хүснэгтээс хайлт хийх логик
          const filterRows = (rows) => {
            return rows.filter(row => 
              row.some(cell => cell?.toString().toLowerCase().includes(searchTerm.toLowerCase().trim()))
            );
          };

          // 📊 ТАЙЛАН БОДОХ СИСТЕМ (Бодит Excel тооцоолол)
          const totalIncoming = gridData.reduce((sum, r) => sum + (parseFloat(r[2]) || 0), 0);
          const totalOutgoing = gridData.reduce((sum, r) => sum + (parseFloat(r[3]) || 0), 0);
          const totalStock = gridData.reduce((sum, r) => sum + (parseFloat(r[4]) || 0), 0);

          return (
            <div className="min-h-screen bg-slate-100 flex font-sans antialiased text-slate-800">
              
              {/* Sidebar / Зүүн цэс */}
              <aside className="w-64 bg-slate-900 text-white flex flex-col shadow-xl select-none">
                <div className="p-5 border-b border-slate-800 bg-slate-950">
                  <h1 className="text-xl font-bold tracking-wider text-blue-400">BEST SHOES</h1>
                  <p className="text-slate-500 text-xs mt-1">Хоосон Excel Модуль v3.0</p>
                </div>
                <nav className="flex-1 p-4 space-y-1">
                  {[
                    { name: 'Агуулахын Бүртгэл', icon: '📦' },
                    { name: 'Бодит Тайлан', icon: '📈' },
                    { name: 'Excel / ODS импорт', icon: '📁' },
                    { name: 'Тохиргоо', icon: '⚙️' }
                  ].map((menu) => (
                    <div 
                      key={menu.name} 
                      onClick={() => setActiveMenu(menu.name)}
                      className={`p-3 rounded-xl cursor-pointer text-sm transition font-medium flex items-center gap-3 ${activeMenu === menu.name ? 'bg-blue-600 text-white shadow-md' : 'hover:bg-slate-800 text-slate-400 hover:text-white'}`}
                    >
                      <span>{menu.icon}</span>
                      {menu.name}
                    </div>
                  ))}
                </nav>
                <div className="p-4 border-t border-slate-800">
                  <button onClick={exportToExcel} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs py-2.5 px-4 rounded-xl shadow transition flex items-center justify-center gap-2">
                    💾 Шинэ Excel татаж авах
                  </button>
                </div>
              </aside>

              {/* Баруун талын Ажлын Талбар */}
              <main className="flex-1 flex flex-col overflow-hidden">
                
                {/* Дээд хэсэг */}
                <header className="bg-white border-b border-slate-200 p-4 px-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                  <div>
                    <h2 className="text-xl font-bold text-slate-900">{activeMenu}</h2>
                    <p className="text-slate-400 text-xs">Мөр, Баганы нэрсээ өөрөө дараад шууд засна уу (Бүрэн уян хатан)</p>
                  </div>
                  <div className="flex items-center gap-3 w-full sm:w-auto">
                    <input 
                      type="text" 
                      placeholder="Хүснэгтээс хайх..." 
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="px-4 py-2 border border-slate-300 rounded-xl text-xs bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 w-full sm:w-56"
                    />
                  </div>
                </header>

                {/* Ажлын талбар */}
                <div className="flex-1 p-6 overflow-auto">

                  {/* 1. АГУУЛАХЫН СЭЛБЭГ ХҮСНЭГТ */}
                  {activeMenu === 'Агуулахын Бүртгэл' && (
                    <div className="space-y-4">
                      <div className="flex gap-2">
                        <button onClick={addRow} className="bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-semibold px-3 py-1.5 rounded-lg border border-blue-200 transition">+ Шинэ мөр нэмэх</button>
                        <button onClick={removeRow} className="bg-red-50 hover:bg-red-100 text-red-700 text-xs font-semibold px-3 py-1.5 rounded-lg border border-red-200 transition">- Сүүлийн мөр хасах</button>
                      </div>

                      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        <div className="overflow-x-auto">
                          <table className="w-full excel-table text-left border-collapse">
                            <thead className="bg-slate-100 select-none">
                              <tr>
                                {headers.map((h, idx) => (
                                  <th key={idx} className="p-0 border border-slate-300 bg-slate-100 min-w-[150px]">
                                    <input 
                                      type="text" 
                                      value={h} 
                                      onChange={(e) => handleHeaderChange(e.target.value, idx)}
                                      title="Баганы нэрийг засахын тулд дарна уу"
                                    />
                                  </th>
                                ))}
                              </tr>
                            </thead>
                            <tbody>
                              {filterRows(gridData).map((row, rIdx) => (
                                <tr key={rIdx} className="hover:bg-slate-50/50 transition">
                                  {row.map((cell, cIdx) => (
                                    <td key={cIdx} className={cIdx === 4 ? "bg-slate-50 font-bold text-blue-600" : ""}>
                                      <input 
                                        type="text" 
                                        value={cell || ''} 
                                        disabled={cIdx === 4} // Үлдэгдэл баганыг автоматаар бодох тул цоожилно
                                        onChange={(e) => handleCellChange(e.target.value, rIdx, cIdx)}
                                        placeholder={cIdx === 4 ? "Автомат" : ""}
                                      />
                                    </td>
                                  ))}
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* 2. БОДИТ ТАЙЛАН */}
                  {activeMenu === 'Бодит Тайлан' && (
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Нийт Орлого (C баганын нийлбэр)</p>
                        <h3 className="text-3xl font-bold mt-2 text-blue-600">{totalIncoming.toLocaleString()} ш</h3>
                      </div>
                      <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Нийт Зарлага (D baggage-ийн нийлбэр)</p>
                        <h3 className="text-3xl font-bold mt-2 text-orange-600">{totalOutgoing.toLocaleString()} ш</h3>
                      </div>
                      <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Бодит Үлдэгдэл (E баганын нийлбэр)</p>
                        <h3 className="text-3xl font-bold mt-2 text-emerald-600">{totalStock.toLocaleString()} ш</h3>
                      </div>
                    </div>
                  )}

                  {/* 3. EXCEL ИМПОРТ */}
                  {activeMenu === 'Excel / ODS импорт' && (
                    <div className="bg-white p-10 rounded-2xl border border-slate-200 shadow-sm max-w-xl mx-auto text-center space-y-4">
                      <span className="text-5xl block">📁</span>
                      <h3 className="text-lg font-bold text-slate-800">Бэлэн `.ods` эсвэл `.xlsx` файл уншуулах</h3>
                      <p className="text-xs text-slate-400 leading-relaxed">Та файлаа оруулснаар систем шууд нүд бүрийг таньж засах хувилбарт шилжүүлнэ. С, D баганыг уншаад Үлдэгдлийг өөрөө бодно.</p>
                      <div className="border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-2xl p-10 bg-slate-50 relative cursor-pointer transition">
                        <input type="file" accept=".xlsx, .xls, .ods" onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer w-full h-full" />
                        <p className="text-xs font-medium text-slate-600">Файлаа сонгох эсвэл энд чирч авчирна уу</p>
                      </div>
                    </div>
                  )}

                  {/* 4. ТОХИРГОО */}
                  {activeMenu === 'Тохиргоо' && (
                    <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm max-w-md">
                      <h4 className="font-bold text-slate-800 mb-4 text-base">Үйлдвэрийн системийн төлөв</h4>
                      <p className="text-sm text-slate-500">Байгууллага: <b className="text-slate-800">Best Shoes LLC</b></p>
                      <p className="text-sm text-slate-500 mt-2">Төлөв: <b className="text-emerald-600">Excel ухаалаг хүснэгтийн горим идэвхтэй</b></p>
                    </div>
                  )}

                </div>
              </main>

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CleanExcelApp />);
    </script>
</body>
</html>
