<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Агуулах & ХАБЭА-н Нэгдсэн Систем</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        /* Excel шиг шууд засах нүдний загвар */
        .excel-input {
            width: 100%;
            height: 100%;
            padding: 8px;
            border: none;
            outline: none;
            background: transparent;
            font-size: 13px;
        }
        .excel-input:focus {
            background-color: #f0fdf4;
            box-shadow: inset 0 0 0 2px #16a34a;
        }
        /* Багана нуух баруун товчны цэвэрхэн popup цэс */
        .context-menu {
            position: absolute;
            z-index: 100;
            background: white;
            border: 1px solid #cbd5e1;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            border-radius: 8px;
            padding: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body class="bg-slate-100">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function IntegratedApp() {
          // --- 1. НЭВТРЭХ ХЭСЭГ (Үндсэн нууц үг: 9761) ---
          const [isLoggedIn, setIsLoggedIn] = useState(false);
          const [username, setUsername] = useState('admin');
          const [password, setPassword] = useState('');
          const [systemPassword, setSystemPassword] = useState('9761'); 
          const [newPasswordInput, setNewPasswordInput] = useState('');

          // --- 2. АПП-ЫН НАВИГАЦИ & ХАЙЛТ ---
          const [activeMenu, setActiveMenu] = useState('Хяналтын самбар');
          const [searchTerm, setSearchTerm] = useState('');
          
          // --- 3. СЭЛБЭГИЙН АГУУЛАХ (Sheet 1) ---
          const [warehouseHeaders, setWarehouseHeaders] = useState([
            { id: 'name', label: 'Барааны нэр', visible: true },
            { id: 'code', label: 'Материалын код', visible: true },
            { id: 'incoming', label: 'Орлого (Тоо)', visible: true },
            { id: 'outgoing', label: 'Зарлага (Тоо)', visible: true },
            { id: 'remain', label: 'Үлдэгдэл', visible: true },
            { id: 'supplier', label: 'Нийлүүлэгч / Тасаг', visible: true }
          ]);
          const [warehouseData, setWarehouseData] = useState([
            ['Пүрш', 'SPR-001', '120', '20', '100', 'Блю Стар ХХК'],
            ['Боолт M10', 'BLT-010', '500', '50', '450', 'Техно Импекс'],
            ['LED гэрэл 50W', 'LED-050', '30', '0', '30', 'Электро Сервис'],
            ['Ажлын бээлий', 'GLV-002', '200', '15', '185', 'Дотоод Сорс'],
          ]);

          // --- 4. ХАБЭА БҮРТГЭЛ (Sheet 2) ---
          const [hseHeaders, setHseHeaders] = useState([
            { id: 'topic', label: 'Үйлдвэрийн зааварчилгааны сэдэв', visible: true },
            { id: 'type', label: 'Зааврын ангилал', visible: true },
            { id: 'code', label: 'Дотоод код', visible: true },
            { id: 'dept', label: 'Хамаарах тасаг хэлтэс', visible: true }
          ]);
          const [hseData, setHseData] = useState([
            ['Оёдолын машины аюулгүй ажиллагаа', 'Ерөнхий зааварчилгаа', 'HSE-001', 'Оёдолын тасаг'],
            ['Агуулахын өргөгч крантай ажиллах журам', 'Тусгай зааварчилгаа', 'HSE-002', 'Агуулах хэсэг'],
            ['Гал түймрийн аюулаас урьдчилан сэргийлэх', 'Гал унтраах заавар', 'HSE-003', 'Нийт ажилчид'],
          ]);

          // Багана нуух Popup цэсний байрлал
          const [contextMenu, setContextMenu] = useState({ visible: false, x: 0, y: 0, colIdx: null, sheet: null });

          // Орлого / Зарлагын ухаалаг модаль цонхнууд
          const [isIncomingModalOpen, setIsIncomingModalOpen] = useState(false);
          const [isOutgoingModalOpen, setIsOutgoingModalOpen] = useState(false);
          const [modalForm, setModalForm] = useState({ name: '', code: '', qty: '', extra: '' });

          // Автомат үлдэгдэл бодогч томьёо (Орлого - Зарлага = Үлдэгдэл)
          useEffect(() => {
            const updated = warehouseData.map(row => {
              const inc = parseFloat(row[2]) || 0;
              const out = parseFloat(row[3]) || 0;
              const rem = inc - out;
              const newRow = [...row];
              newRow[4] = rem.toString();
              return newRow;
            });
            if (JSON.stringify(updated) !== JSON.stringify(warehouseData)) {
              setWarehouseData(updated);
            }
          }, [warehouseData]);

          // Системд нэвтрэх удирдамж
          const handleLogin = (e) => {
            e.preventDefault();
            if (password === systemPassword) {
              setIsLoggedIn(true);
            } else {
              alert('Уучлаарай, нэвтрэх нууц үг буруу байна!');
            }
          };

          // Дотроос нь код шинэчлэн солих функц
          const handlePasswordChange = (e) => {
            e.preventDefault();
            if (newPasswordInput.trim().length > 0) {
              setSystemPassword(newPasswordInput.trim());
              alert(`Нууц үгийг амжилттай солилоо! Шинэ код: ${newPasswordInput.trim()}`);
              setNewPasswordInput('');
            } else {
              alert('Шинэ код хоосон байж болохгүй.');
            }
          };

          // Excel шиг нүдний утга шууд солих
          const handleCellChange = (value, rIdx, cIdx, sheet) => {
            if (sheet === 'warehouse') {
              const updated = [...warehouseData];
              updated[rIdx][cIdx] = value;
              setWarehouseData(updated);
            } else {
              const updated = [...hseData];
              updated[rIdx][cIdx] = value;
              setHseData(updated);
            }
          };

          // Мөр нэмж хасах
          const addRow = (sheet) => {
            if (sheet === 'warehouse') {
              setWarehouseData([...warehouseData, Array(warehouseHeaders.length).fill('')]);
            } else {
              setHseData([...hseData, Array(hseHeaders.length).fill('')]);
            }
          };

          const removeRow = (sheet) => {
            if (sheet === 'warehouse' && warehouseData.length > 0) setWarehouseData(warehouseData.slice(0, -1));
            if (sheet === 'hse' && hseData.length > 0) setHseData(hseData.slice(0, -1));
          };

          // Багана нуух (Hide)
          const hideColumn = (colIdx, sheet) => {
            if (sheet === 'warehouse') {
              const updated = [...warehouseHeaders];
              updated[colIdx].visible = false;
              setWarehouseHeaders(updated);
            } else {
              const updated = [...hseHeaders];
              updated[colIdx].visible = false;
              setHseHeaders(updated);
            }
            setContextMenu({ ...contextMenu, visible: false });
          };

          // Нуусан баганыг ил гаргах (Unhide)
          const unhideAllColumns = (sheet) => {
            if (sheet === 'warehouse') {
              setWarehouseHeaders(warehouseHeaders.map(h => ({ ...h, visible: true })));
            } else {
              setHseHeaders(hseHeaders.map(h => ({ ...h, visible: true })));
            }
          };

          // Гарчиг дээр дарахад нуух цэс гаргах
          const openHideMenu = (e, colIdx, sheet) => {
            e.preventDefault();
            setContextMenu({
              visible: true,
              x: e.pageX,
              y: e.pageY,
              colIdx,
              sheet
            });
          };

          // Модалаар шинээр орлого бүртгэх
          const submitIncoming = (e) => {
            e.preventDefault();
            if (!modalForm.name || !modalForm.qty) return alert('Нэр болон Тоог оруулна уу');
            setWarehouseData([[modalForm.name, modalForm.code || '---', modalForm.qty, '0', modalForm.qty, modalForm.extra || 'Шинэ бараа'], ...warehouseData]);
            setIsIncomingModalOpen(false);
            setModalForm({ name: '', code: '', qty: '', extra: '' });
          };

          // Модалаар шинээр зарлага бүртгэх
          const submitOutgoing = (e) => {
            e.preventDefault();
            if (!modalForm.name || !modalForm.qty) return alert('Нэр болон Тоог оруулна уу');
            setWarehouseData([[modalForm.name, modalForm.code || '---', '0', modalForm.qty, '0', modalForm.extra || 'Үйлдвэр тасаг'], ...warehouseData]);
            setIsOutgoingModalOpen(false);
            setModalForm({ name: '', code: '', qty: '', extra: '' });
          };

          // Excel / ODS файл уншуулж хүснэгт шинэчлэх
          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
              try {
                const bstr = evt.target.result;
                const wb = XLSX.read(bstr, { type: 'binary' });
                if (wb.SheetNames.length > 0) {
                  const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                  if (data.length > 0) {
                    setWarehouseHeaders(data[0].map((h, i) => ({ id: `w_${i}`, label: h || `Багана ${i+1}`, visible: true })));
                    setWarehouseData(data.slice(1).filter(r => r.length > 0));
                  }
                }
                if (wb.SheetNames.length > 1) {
                  const data2 = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[1]], { header: 1 });
                  if (data2.length > 0) {
                    setHseHeaders(data2[0].map((h, i) => ({ id: `h_${i}`, label: h || `Багана ${i+1}`, visible: true })));
                    setHseData(data2.slice(1).filter(r => r.length > 0));
                  }
                }
                alert("Файлын хүснэгтийг амжилттай шилжүүллээ!");
              } catch (err) { alert("Файл уншихад алдаа гарлаа."); }
            };
            reader.readAsBinaryString(file);
          };

          // Шүүлт хийх логик
          const filteredRows = (rows) => {
            if (!searchTerm.trim()) return rows;
            return rows.filter(r => r.some(c => c?.toString().toLowerCase().includes(searchTerm.toLowerCase().trim())));
          };

          // Хяналтын самбарын нийт тоонууд
          const totalIn = warehouseData.reduce((s, r) => s + (parseFloat(r[2]) || 0), 0);
          const totalOut = warehouseData.reduce((s, r) => s + (parseFloat(r[3]) || 0), 0);
          const totalStock = warehouseData.reduce((s, r) => s + (parseFloat(r[4]) || 0), 0);


          // 🔒 ХЭРЭВ НЭВТРЭЭГҮЙ БОЛ ХАРАГДАХ НЭВТРЭХ ХЭСЭГ
          if (!isLoggedIn) {
            return (
              <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center space-y-6">
                  <div>
                    <h1 className="text-2xl font-black text-slate-800 tracking-wider">BEST SHOES</h1>
                    <p className="text-slate-400 text-xs mt-1">Үйлдвэр, Агуулахын Нэгдсэн Систем</p>
                  </div>
                  <form onSubmit={handleLogin} className="space-y-4 text-left">
                    <div>
                      <label className="text-xs font-bold text-slate-500 block mb-1">Нэвтрэх хэрэглэгч</label>
                      <input type="text" value={username} disabled className="w-full border border-slate-200 p-3 rounded-xl bg-slate-50 text-sm outline-none text-slate-600 font-medium" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-500 block mb-1">Системийн нууц үг</label>
                      <input 
                        type="password" 
                        placeholder="••••" 
                        required 
                        value={password} 
                        onChange={(e) => setPassword(e.target.value)} 
                        className="w-full border border-slate-300 p-3 rounded-xl text-sm outline-none focus:border-blue-500" 
                      />
                    </div>
                    <button type="submit" className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold p-3 rounded-xl text-sm transition shadow-md">
                      Систем рүү нэвтрэх
                    </button>
                  </form>
                </div>
              </div>
            );
          }


          // 💻 НЭВТРЭХЭД ХАРАГДАХ ХУУЧИН ТОГТВОРТОЙ ЗАГВАР
          return (
            <div className="min-h-screen flex bg-slate-100" onClick={() => setContextMenu({ ...contextMenu, visible: false })}>
              
              {/* ЗҮҮН ТАЛЫН ХУУЧИН ХАР ЦЭС */}
              <aside className="w-64 bg-slate-900 text-white p-6 hidden md:flex flex-col shadow-xl select-none">
                <div className="mb-8">
                  <h1 className="text-xl font-bold tracking-wider text-blue-400">BEST SHOES</h1>
                  <p className="text-slate-400 text-xs mt-0.5">Үйлдвэрлэл & ХАБЭА</p>
                </div>
                <nav className="space-y-1 flex-1">
                  {[
                    { name: 'Хяналтын самбар', icon: '📊' },
                    { name: 'Сэлбэгийн бүртгэл', icon: '🔧' },
                    { name: 'ХАБЭА бүртгэл', icon: '🛡️' },
                    { name: 'Excel / ODS импорт', icon: '📁' },
                    { name: 'Тохиргоо', icon: '⚙️' }
                  ].map((item) => (
                    <div 
                      key={item.name} 
                      onClick={() => setActiveMenu(item.name)}
                      className={`p-3 rounded-xl cursor-pointer transition flex items-center gap-3 text-sm font-medium ${activeMenu === item.name ? 'bg-blue-600 text-white shadow-md' : 'hover:bg-slate-800 text-slate-300'}`}
                    >
                      <span>{item.icon}</span><span>{item.name}</span>
                    </div>
                  ))}
                </nav>
                <div className="pt-4 border-t border-slate-800">
                  <button onClick={() => setIsLoggedIn(false)} className="w-full bg-slate-800 hover:bg-red-950 text-slate-300 hover:text-red-300 text-xs py-2 rounded-lg transition font-medium">🚪 Системээс гарах</button>
                </div>
              </aside>

              {/* БАРУУН ТАЛЫН ҮНДСЭН АЖЛЫН ХЭСЭГ */}
              <main className="flex-1 p-6 overflow-y-auto flex flex-col">
                
                {/* ДЭЭД УХААЛАГ НАВИГАЦИ СУУРЬ */}
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                  <div>
                    <h2 className="text-xl font-bold text-slate-800">{activeMenu}</h2>
                    <p className="text-slate-400 text-xs mt-0.5">Нүдэн дээр дарж шууд засна. Гарчиг дээр дарж баганыг нууж (Hide) болно.</p>
                  </div>
                  <div className="flex flex-wrap gap-2 w-full md:w-auto">
                    <input 
                      type="text" 
                      placeholder="Эндээс хайна уу..." 
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="px-4 py-2 rounded-xl border border-slate-300 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 w-full md:w-48"
                    />
                    <button onClick={() => setIsIncomingModalOpen(true)} className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-xl text-xs font-semibold shadow transition">+ Орлого</button>
                    <button onClick={() => setIsOutgoingModalOpen(true)} className="bg-orange-600 hover:bg-orange-700 text-white px-3 py-2 rounded-xl text-xs font-semibold shadow transition">- Зарлага</button>
                  </div>
                </div>

                {/* 1. ХЯНАЛТЫН САМБАР */}
                {activeMenu === 'Хяналтын самбар' && (
                  <div className="space-y-6">
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                      <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-center">
                        <p className="text-slate-400 text-xs font-semibold uppercase tracking-wider">Нийт Орлого (Нийлбэр)</p>
                        <h3 className="text-2xl font-black mt-2 text-blue-600">{totalIn.toLocaleString()} ш</h3>
                      </div>
                      <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-center">
                        <p className="text-slate-400 text-xs font-semibold uppercase tracking-wider">Нийт Зарлага (Үйлдвэрт)</p>
                        <h3 className="text-2xl font-black mt-2 text-orange-600">{totalOut.toLocaleString()} ш</h3>
                      </div>
                      <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-center">
                        <p className="text-slate-400 text-xs font-semibold uppercase tracking-wider">Бодит Агуулахын Үлдэгдэл</p>
                        <h3 className="text-2xl font-black mt-2 text-emerald-600">{totalStock.toLocaleString()} ш</h3>
                      </div>
                    </div>
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                      <h4 className="font-bold text-slate-800 text-sm mb-2">💡 Excel Хэрэглээний удирдамж</h4>
                      <p className="text-slate-500 text-xs leading-relaxed">Хүснэгтийн аль нэг баганыг түр нуух (Hide) бол тухайн баганы гарчиг дээр дарахад хажууд нь унах цэс гарч ирнэ. Тэндээс нуух боломжтой бөгөөд хүснэгтийн баруун дээр байрлах <b>"Ил гаргах (Unhide All)"</b> товчоор буцааж сэргээнэ.</p>
                    </div>
                  </div>
                )}

                {/* 2. СЭЛБЭГИЙН БҮРТГЭЛ ХҮСНЭГТ */}
                {activeMenu === 'Сэлбэгийн бүртгэл' && (
                  <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-4">
                    <div className="flex justify-between items-center flex-wrap gap-2">
                      <div className="flex gap-1">
                        <button onClick={() => addRow('warehouse')} className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-300 transition">➕ Мөр нэмэх</button>
                        <button onClick={() => removeRow('warehouse')} className="bg-slate-100 hover:bg-red-50 text-red-600 text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-300 transition">➖ Мөр хасах</button>
                      </div>
                      <button onClick={() => unhideAllColumns('warehouse')} className="text-xs text-blue-600 hover:underline font-semibold">👁️ Нуусан багануудыг ил гаргах (Unhide All)</button>
                    </div>

                    <div className="overflow-x-auto border border-slate-200 rounded-xl">
                      <table className="w-full text-left border-collapse">
                        <thead>
                          <tr className="bg-slate-50 select-none">
                            <th className="border p-2 text-xs font-bold text-slate-400 bg-slate-100 text-center w-10">№</th>
                            {warehouseHeaders.map((h, idx) => h.visible && (
                              <th 
                                key={idx} 
                                onClick={(e) => openHideMenu(e, idx, 'warehouse')}
                                onContextMenu={(e) => openHideMenu(e, idx, 'warehouse')}
                                className="border p-2.5 text-xs font-bold text-slate-600 bg-slate-100 cursor-pointer hover:bg-slate-200 transition"
                                title="Дараад баганыг нууна уу"
                              >
                                {h.label} 🔽
                              </th>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {filteredRows(warehouseData).map((row, rIdx) => (
                            <tr key={rIdx} className="hover:bg-slate-50/60">
                              <td className="border p-2 text-xs text-slate-400 text-center bg-slate-50">{rIdx + 1}</td>
                              {row.map((cell, cIdx) => warehouseHeaders[cIdx]?.visible && (
                                <td key={cIdx} className={`border p-0 ${cIdx === 4 ? "bg-slate-50 font-bold text-emerald-600" : ""}`}>
                                  <input 
                                    type="text" 
                                    value={cell || ''} 
                                    disabled={cIdx === 4} 
                                    onChange={(e) => handleCellChange(e.target.value, rIdx, cIdx, 'warehouse')}
                                    className="excel-input"
                                  />
                                </td>
                              ))}
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* 3. ХАБЭА БҮРТГЭЛ ХҮСНЭГТ */}
                {activeMenu === 'ХАБЭА бүртгэл' && (
                  <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-4">
                    <div className="flex justify-between items-center flex-wrap gap-2">
                      <div className="flex gap-1">
                        <button onClick={() => addRow('hse')} className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-300 transition">➕ Мөр нэмэх</button>
                        <button onClick={() => removeRow('hse')} className="bg-slate-100 hover:bg-red-50 text-red-600 text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-300 transition">➖ Мөр хасах</button>
                      </div>
                      <button onClick={() => unhideAllColumns('hse')} className="text-xs text-blue-600 hover:underline font-semibold">👁️ Нуусан багануудыг ил гаргах (Unhide All)</button>
                    </div>

                    <div className="overflow-x-auto border border-slate-200 rounded-xl">
                      <table className="w-full text-left border-collapse">
                        <thead>
                          <tr className="bg-slate-50 select-none">
                            <th className="border p-2 text-xs font-bold text-slate-400 bg-slate-100 text-center w-10">№</th>
                            {hseHeaders.map((h, idx) => h.visible && (
                              <th 
                                key={idx} 
                                onClick={(e) => openHideMenu(e, idx, 'hse')}
                                onContextMenu={(e) => openHideMenu(e, idx, 'hse')}
                                className="border p-2.5 text-xs font-bold text-slate-600 bg-slate-100 cursor-pointer hover:bg-slate-200 transition"
                                title="Дараад баганыг нууна уу"
                              >
                                {h.label} 🔽
                              </th>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {filteredRows(hseData).map((row, rIdx) => (
                            <tr key={rIdx} className="hover:bg-slate-50/60">
                              <td className="border p-2 text-xs text-slate-400 text-center bg-slate-50">{rIdx + 1}</td>
                              {row.map((cell, cIdx) => hseHeaders[cIdx]?.visible && (
                                <td key={cIdx} className="border p-0">
                                  <input 
                                    type="text" 
                                    value={cell || ''} 
                                    onChange={(e) => handleCellChange(e.target.value, rIdx, cIdx, 'hse')}
                                    className="excel-input"
                                  />
                                </td>
                              ))}
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* 4. EXCEL ИМПОРТ ЛОГИК */}
                {activeMenu === 'Excel / ODS импорт' && (
                  <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm max-w-md mx-auto text-center space-y-4 my-auto">
                    <span className="text-4xl block">📁</span>
                    <h3 className="text-base font-bold text-slate-800">Одоо байгаа .ods файл нээх</h3>
                    <p className="text-xs text-slate-400 leading-relaxed">Та өөрийн файлаа энд уншуулахад систем автоматаар нүд бүрийг нь засдаг Excel хүснэгтийн форматад шилжүүлнэ.</p>
                    <div className="border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-xl p-8 bg-slate-50 relative cursor-pointer transition">
                      <input type="file" accept=".xlsx, .xls, .ods" onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer" />
                      <p className="text-xs font-medium text-slate-600">Файлаа сонгож оруулна уу</p>
                    </div>
                  </div>
                )}

                {/* 5. ТОХИРГОО (НУУЦ ҮГ ЗАСАЖ СОЛЬДОГ ХЭСЭГ) */}
                {activeMenu === 'Тохиргоо' && (
                  <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm max-w-md space-y-5">
                    <div>
                      <h4 className="font-bold text-slate-800 text-base">🔐 Системийн нууц үг солих</h4>
                      <p className="text-slate-400 text-xs mt-0.5">Нэвтрэх үед ашиглагддаг кодыг эндээс шинэчлэн засна.</p>
                    </div>
                    <form onSubmit={handlePasswordChange} className="space-y-4 text-xs">
                      <div>
                        <label className="text-slate-500 font-semibold block mb-1">Одоо ашиглагдаж буй код</label>
                        <input type="text" value={systemPassword} disabled className="w-full border p-2.5 rounded-xl bg-slate-50 font-bold text-slate-700" />
                      </div>
                      <div>
                        <label className="text-slate-500 font-semibold block mb-1">Шинээр тавих нууц үг</label>
                        <input 
                          type="text" 
                          required 
                          placeholder="Шинэ код оруулна уу..."
                          value={newPasswordInput} 
                          onChange={(e) => setNewPasswordInput(e.target.value)} 
                          className="w-full border p-2.5 rounded-xl outline-none focus:border-blue-500 font-medium" 
                        />
                      </div>
                      <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2.5 rounded-xl transition shadow">
                        Шинэ кодыг хадгалах
                      </button>
                    </form>
                  </div>
                )}

              </main>

              {/* БАГАНА ДЭЭР ДАРАХАД ГАРАХ ХУУДАС (❌ НУУХ ЦЭС) */}
              {contextMenu.visible && (
                <div className="context-menu shadow-xl bg-white border" style={{ top: contextMenu.y, left: contextMenu.x }}>
                  <button 
                    onClick={() => hideColumn(contextMenu.colIdx, contextMenu.sheet)}
                    className="w-full text-left px-4 py-2 hover:bg-red-50 rounded text-red-600 font-bold"
                  >
                    ❌ Энэ баганыг нуух (Hide Column)
                  </button>
                </div>
              )}

              {/* ОРЛОГЫН ЦОНХ (MODAL) */}
              {isIncomingModalOpen && (
                <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center p-4 z-50 backdrop-blur-xs">
                  <div className="bg-white rounded-2xl p-5 max-w-sm w-full shadow-2xl">
                    <h4 className="font-bold text-slate-800 text-sm mb-3">📥 Шинэ орлого бүртгэх</h4>
                    <form onSubmit={submitIncoming} className="space-y-3 text-xs">
                      <div><label className="block mb-1 font-medium">Сэлбэг, барааны нэр *</label><input type="text" required value={modalForm.name} onChange={e => setModalForm({...modalForm, name: e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                      <div><label className="block mb-1 font-medium">Код</label><input type="text" value={modalForm.code} onChange={e => setModalForm({...modalForm, code: e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                      <div><label className="block mb-1 font-medium">Орлогодох тоо ширхэг *</label><input type="number" required value={modalForm.qty} onChange={e => setModalForm({...modalForm, qty: e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                      <div><label className="block mb-1 font-medium">Нийлүүлэгч</label><input type="text" value={modalForm.extra} onChange={e => setModalForm({...modalForm, extra: e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                      <div className="flex gap-2 justify-end pt-2">
                        <button type="button" onClick={() => setIsIncomingModalOpen(false)} className="bg-slate-100 px-3 py-2 rounded-xl font-medium">Цуцлах</button>
                        <button type="submit" className="bg-blue-600 text-white px-3 py-2 rounded-xl font-bold">Орлогодох</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {/* ЗАРЛАГЫН ЦОНХ (MODAL) */}
              {isOutgoingModalOpen && (
                <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center p-4 z-50 backdrop-blur-xs">
                  <div className="bg-white rounded-2xl p-5 max-w-sm w-full shadow-2xl">
                    <h4 className="font-bold text-slate-800 text-sm mb-3">📤 Зарлагын хуудас үүсгэх</h4>
                    <form onSubmit={submitOutgoing} className="space-y-3 text-xs">
                      <div><label className="block mb-1 font-medium">Зарлагадах барааны нэр *</label><input type="text" required value={modalForm.name} onChange={e => setModalForm({...modalForm, name: e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                      <div><label className="block mb-1 font-medium">Код</label><input type="text" value={modalForm.code} onChange={e => setModalForm({...modalForm, code: e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                      <div><label className="block mb-1 font-medium">Зарлагадах тоо ширхэг *</label><input type="number" required value={modalForm.qty} onChange={e => setModalForm({...modalForm, qty: e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                      <div><label className="block mb-1 font-medium">Хүлээн авах тасаг хэлтэс</label><input type="text" value={modalForm.extra} onChange={e => setModalForm({...modalForm, extra: e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                      <div className="flex gap-2 justify-end pt-2">
                        <button type="button" onClick={() => setIsOutgoingModalOpen(false)} className="bg-slate-100 px-3 py-2 rounded-xl font-medium">Цуцлах</button>
                        <button type="submit" className="bg-orange-600 text-white px-3 py-2 rounded-xl font-bold">Зарлагадах</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<IntegratedApp />);
    </script>
</body>
</html>
