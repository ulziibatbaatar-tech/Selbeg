<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Агуулахын Нэгдсэн Систем</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function InventoryDashboard() {
          const [activeMenu, setActiveMenu] = useState('Хяналтын самбар');
          const [searchTerm, setSearchTerm] = useState('');
          const [isModalOpen, setIsModalOpen] = useState(false);

          // Формын State-үүд
          const [newName, setNewName] = useState('');
          const [newCode, setNewCode] = useState('');
          const [newQty, setNewQty] = useState('');
          const [newSupplier, setNewSupplier] = useState('');

          // 1. ОРЛОГЫН ДАТА (State)
          const [recentIncoming, setRecentIncoming] = useState([
            { name: 'Пүрш', code: 'SPR-001', qty: 120, supplier: 'Блю Стар ХХК', date: '2026-05-24' },
            { name: 'Боолт M10', code: 'BLT-010', qty: 500, supplier: 'Техно Импекс', date: '2026-05-23' },
            { name: 'LED гэрэл 50W', code: 'LED-050', qty: 30, supplier: 'Электро Сервис', date: '2026-05-22' },
          ]);

          // 2. ЗАРЛАГЫН ДАТА
          const [recentOutgoing, setRecentOutgoing] = useState([
            { name: 'Пүрш', code: 'SPR-001', qty: 20, department: 'Засварын хэсэг', date: '2026-05-25' },
            { name: 'Хошуувч', code: 'NOZ-005', qty: 5, department: 'Оёдолын тасаг', date: '2026-05-24' },
            { name: 'Ажлын бээлий', code: 'GLV-002', qty: 10, department: 'Үйлдвэрлэл', date: '2026-05-22' },
          ]);

          // 3. ХАБЭА БҮРТГЭЛИЙН ДАТА
          const [hseRecords, setHseRecords] = useState([
            { id: 1, topic: 'Оёдолын машины аюулгүй ажиллагаа', employee: 'Б. Бат-Эрдэнэ', status: 'Баталгаажсан', date: '2026-05-25' },
            { id: 2, topic: 'Агуулахын өргөгч цахилгаан шатны заавар', employee: 'Г. Болд', status: 'Баталгаажсан', date: '2026-05-24' },
            { id: 3, topic: 'Гал түймрийн аюулаас урьдчилан сэргийлэх', employee: 'Ц. Саруул', status: 'Хүлээгдэж буй', date: '2026-05-20' },
          ]);

          // 4. ХЭРЭГЛЭГЧДИЙН ДАТА
          const [users, setUsers] = useState([
            { name: 'Өлзийбат Баатар', role: 'Админ / Ахлах менежер', email: 'ulziibat@bestshoes.mn', phone: '9911xxxx' },
            { name: 'А. Наран', role: 'Агуулахын нярав', email: 'naran@bestshoes.mn', phone: '8811xxxx' },
          ]);

          // Статистик бодолт
          const totalItems = recentIncoming.length;
          const totalStock = recentIncoming.reduce((sum, item) => sum + Number(item.qty || 0), 0) - recentOutgoing.reduce((sum, item) => sum + Number(item.qty || 0), 0);
          const todayIncoming = recentIncoming.filter(i => i.date === '2026-05-25' || i.date === new Date().toISOString().split('T')[0]).length;
          const todayOutgoing = recentOutgoing.filter(i => i.date === '2026-05-25').length;

          const stats = [
            { title: 'Нийт нэр төрөл', value: totalItems },
            { title: 'Бодит үлдэгдэл', value: totalStock.toLocaleString() },
            { title: 'Өнөөдрийн орлого', value: todayIncoming },
            { title: 'Өнөөдрийн зарлага', value: todayOutgoing },
          ];

          // 📂 EXCEL / ODS УНШИЖ ИМПОРТЛОХ
          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
              try {
                const bstr = evt.target.result;
                const wb = XLSX.read(bstr, { type: 'binary' });
                const wsname = wb.SheetNames[0];
                const ws = wb.Sheets[wsname];
                const rawData = XLSX.utils.sheet_to_json(ws, { header: 1 });
                
                if (!rawData || rawData.length === 0) return alert("Файл хоосон байна.");

                const importedItems = [];
                rawData.forEach((row, index) => {
                  if (index === 0 || !row || row.length === 0) return;
                  const name = row[0]?.toString().trim();
                  const code = row[1]?.toString().trim() || '---';
                  const qty = parseInt(row[2]) || 0;
                  const supplier = row[3]?.toString().trim() || 'Файлаас импортолсон';

                  if (name && name !== "Нэр" && name !== "Нийт") {
                    importedItems.push({ name, code, qty, supplier, date: new Date().toISOString().split('T')[0] });
                  }
                });

                if (importedItems.length === 0) return alert("Тохирох өгөгдөл олдсонгүй.");

                setRecentIncoming([...importedItems, ...recentIncoming]);
                alert(`Амжилттай! ${importedItems.length} ш барааг импортоор авлаа.`);
                setActiveMenu('Хяналтын самбар');
              } catch (error) {
                alert("Файл уншихад алдаа гарлаа.");
              }
            };
            reader.readAsBinaryString(file);
          };

          // Шинэ орлого гар аргаар нэмэх
          const handleAddIncoming = (e) => {
            e.preventDefault();
            if (!newName || !newCode || !newQty || !newSupplier) return alert('Бүх талбарыг бөглөнө үү!');

            const newItem = {
              name: newName, code: newCode, qty: parseInt(newQty), supplier: newSupplier, date: new Date().toISOString().split('T')[0]
            };

            setRecentIncoming([newItem, ...recentIncoming]);
            setIsModalOpen(false);
            setNewName(''); setNewCode(''); setNewQty(''); setNewSupplier('');
          };

          // Хайлтын систем
          const filterData = (list) => {
            return list.filter(item => {
              const search = searchTerm.trim().toLowerCase();
              if (!search) return true;
              return (
                item.name?.toLowerCase().includes(search) ||
                item.code?.toLowerCase().includes(search) ||
                item.supplier?.toLowerCase().includes(search) ||
                item.department?.toLowerCase().includes(search) ||
                item.employee?.toLowerCase().includes(search) ||
                item.topic?.toLowerCase().includes(search)
              );
            });
          };

          return (
            <div className="min-h-screen bg-slate-100 flex">
              {/* Sidebar */}
              <aside className="w-72 bg-slate-900 text-white p-6 hidden md:block shadow-xl">
                <div className="mb-10">
                  <h1 className="text-2xl font-bold tracking-wider text-blue-400">BEST SHOES LLC</h1>
                  <p className="text-slate-400 text-xs mt-1">Агуулах & ХАБЭА-н систем</p>
                </div>

                <nav className="space-y-2">
                  {[
                    { name: 'Хяналтын самбар', icon: '📊' },
                    { name: 'Сэлбэгийн бүртгэл', icon: '🔧' },
                    { name: 'Орлого', icon: '📥' },
                    { name: 'Зарлага', icon: '📤' },
                    { name: 'Үлдэгдэл', icon: '📦' },
                    { name: 'ХАБЭА бүртгэл', icon: '🛡️' },
                    { name: 'Тайлан', icon: '📈' },
                    { name: 'Excel / ODS импорт', icon: '📁' },
                    { name: 'Хэрэглэгчид', icon: '👥' },
                    { name: 'Тохиргоо', icon: '⚙️' }
                  ].map((item) => (
                    <div 
                      key={item.name} 
                      onClick={() => setActiveMenu(item.name)}
                      className={`p-3 rounded-xl cursor-pointer transition flex items-center gap-3 ${activeMenu === item.name ? 'bg-blue-600 text-white font-medium shadow-md' : 'hover:bg-slate-800 text-slate-300'}`}
                    >
                      <span>{item.icon}</span>
                      <span>{item.name}</span>
                    </div>
                  ))}
                </nav>
              </aside>

              {/* Main Content */}
              <main className="flex-1 p-6 overflow-y-auto">
                {/* Header */}
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                  <div>
                    <h2 className="text-2xl font-bold text-slate-800">{activeMenu}</h2>
                    <p className="text-slate-500 text-sm">Системийн бодит хугацааны удирдлага</p>
                  </div>
                  <div className="flex gap-3 w-full md:w-auto">
                    <input 
                      type="text" 
                      placeholder="Хайлт хийх..." 
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="px-4 py-2.5 rounded-xl border border-slate-300 w-full md:w-64 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" 
                    />
                    <button 
                      onClick={() => setIsModalOpen(true)}
                      className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-medium shadow-sm text-sm whitespace-nowrap transition"
                    >
                      + Шинэ орлого
                    </button>
                  </div>
                </div>

                {/* 1. ХЯНАЛТЫН САМБАР */}
                {activeMenu === 'Хяналтын самбар' && (
                  <>
                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-5 mb-8">
                      {stats.map((stat) => (
                        <div key={stat.title} className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                          <p className="text-slate-500 text-sm font-medium">{stat.title}</p>
                          <h3 className="text-3xl font-bold mt-2 text-slate-800">{stat.value}</h3>
                        </div>
                      ))}
                    </div>

                    <div className="grid grid-cols-1 xl:grid-cols-2 gap-6 mb-8">
                      <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                        <h3 className="text-lg font-bold text-slate-800 mb-4">Сүүлийн орлогууд</h3>
                        <table className="w-full text-sm">
                          <thead><tr className="text-left border-b border-slate-200 text-slate-500"><th className="pb-2">Нэр</th><th className="pb-2">Тоо</th></tr></thead>
                          <tbody>{filterData(recentIncoming).slice(0,3).map((item, i) => (<tr key={i} className="border-b border-slate-100"><td className="py-3 font-medium">{item.name}</td><td className="py-3 text-blue-600 font-bold">+{item.qty}</td></tr>))}</tbody>
                        </table>
                      </div>
                      <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                        <h3 className="text-lg font-bold text-slate-800 mb-4">Сүүлийн зарлагууд</h3>
                        <table className="w-full text-sm">
                          <thead><tr className="text-left border-b border-slate-200 text-slate-500"><th className="pb-2">Нэр</th><th className="pb-2">Тоо</th></tr></thead>
                          <tbody>{filterData(recentOutgoing).slice(0,3).map((item, i) => (<tr key={i} className="border-b border-slate-100"><td className="py-3 font-medium">{item.name}</td><td className="py-3 text-orange-600 font-bold">-{item.qty}</td></tr>))}</tbody>
                        </table>
                      </div>
                    </div>
                  </>
                )}

                {/* 2. СЭЛБЭГИЙН БҮРТГЭЛ & ҮЛДЭГДЭЛ */}
                {(activeMenu === 'Сэлбэгийн бүртгэл' || activeMenu === 'Үлдэгдэл') && (
                  <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                    <table className="w-full text-sm">
                      <thead>
                        <tr className="text-left border-b border-slate-200 text-slate-500">
                          <th className="pb-3">Барааны нэр</th><th className="pb-3">Код</th><th className="pb-3">Бодит үлдэгдэл</th><th className="pb-3">Төлөв</th>
                        </tr>
                      </thead>
                      <tbody>
                        {filterData(recentIncoming).map((item, i) => {
                          const outgoingQty = recentOutgoing.filter(o => o.code === item.code).reduce((sum, o) => sum + o.qty, 0);
                          const currentQty = item.qty - outgoingQty;
                          return (
                            <tr key={i} className="border-b border-slate-100">
                              <td className="py-3 font-medium text-slate-800">{item.name}</td>
                              <td className="py-3 text-slate-500">{item.code}</td>
                              <td className="py-3 font-bold text-slate-700">{currentQty} ш</td>
                              <td className="py-3">
                                {currentQty <= 0 ? <span className="px-2 py-1 text-xs font-semibold bg-red-100 text-red-700 rounded-lg">Дууссан</span> : 
                                 currentQty < 40 ? <span className="px-2 py-1 text-xs font-semibold bg-yellow-100 text-yellow-700 rounded-lg">Үлдэгдэл бага</span> : 
                                 <span className="px-2 py-1 text-xs font-semibold bg-green-100 text-green-700 rounded-lg">Хэвийн</span>}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}

                {/* 3. ОРЛОГО */}
                {activeMenu === 'Орлого' && (
                  <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                    <table className="w-full text-sm">
                      <thead>
                        <tr className="text-left border-b border-slate-200 text-slate-500">
                          <th className="pb-3">Нэр</th><th className="pb-3">Код</th><th className="pb-3">Орсон тоо</th><th className="pb-3">Нийлүүлэгч</th><th className="pb-3">Огноо</th>
                        </tr>
                      </thead>
                      <tbody>
                        {filterData(recentIncoming).map((item, i) => (
                          <tr key={i} className="border-b border-slate-100">
                            <td className="py-3 font-medium">{item.name}</td>
                            <td>{item.code}</td>
                            <td className="text-blue-600 font-bold">+{item.qty}</td>
                            <td>{item.supplier}</td>
                            <td className="text-slate-400">{item.date}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}

                {/* 4. ЗАРЛАГАТАЙ ХОЛБООТОЙ ХУУДАС */}
                {activeMenu === 'Зарлага' && (
                  <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                    <table className="w-full text-sm">
                      <thead>
                        <tr className="text-left border-b border-slate-200 text-slate-500">
                          <th className="pb-3">Нэр</th><th className="pb-3">Код</th><th className="pb-3">Зарлагадсан</th><th className="pb-3">Хүлээж авсан хэлтэс</th><th className="pb-3">Огноо</th>
                        </tr>
                      </thead>
                      <tbody>
                        {filterData(recentOutgoing).map((item, i) => (
                          <tr key={i} className="border-b border-slate-100">
                            <td className="py-3 font-medium">{item.name}</td>
                            <td>{item.code}</td>
                            <td className="text-orange-600 font-bold">-{item.qty}</td>
                            <td>{item.department}</td>
                            <td className="text-slate-400">{item.date}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}

                {/* 5. ХАБЭА БҮРТГЭЛ */}
                {activeMenu === 'ХАБЭА бүртгэл' && (
                  <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                    <h3 className="text-lg font-bold text-slate-800 mb-4">Ажилчдын зааварчилгаа, баталгаажуулалт</h3>
                    <table className="w-full text-sm">
                      <thead>
                        <tr className="text-left border-b border-slate-200 text-slate-500">
                          <th className="pb-3">Зааварчилгааны сэдэв</th><th className="pb-3">Ажилтан</th><th className="pb-3">Төлөв</th><th className="pb-3">Огноо</th>
                        </tr>
                      </thead>
                      <tbody>
                        {filterData(hseRecords).map((item) => (
                          <tr key={item.id} className="border-b border-slate-100">
                            <td className="py-3 font-medium">{item.topic}</td>
                            <td>{item.employee}</td>
                            <td>
                              <span className={`px-2 py-0.5 text-xs font-semibold rounded-md ${item.status === 'Баталгаажсан' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}`}>
                                {item.status}
                              </span>
                            </td>
                            <td className="text-slate-400">{item.date}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}

                {/* 6. ТАЙЛАН */}
                {activeMenu === 'Тайлан' && (
                  <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
                    <h3 className="text-lg font-bold text-slate-800">Агуулахын үйл ажиллагааны тайлан</h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div className="border border-slate-200 p-4 rounded-xl bg-slate-50">
                        <p className="text-slate-500 text-sm">Нийт орлогын гүйлгээ</p>
                        <h4 className="text-2xl font-bold text-blue-600 mt-1">{recentIncoming.length} удаа</h4>
                      </div>
                      <div className="border border-slate-200 p-4 rounded-xl bg-slate-50">
                        <p className="text-slate-500 text-sm">Нийт зарлагын гүйлгээ</p>
                        <h4 className="text-2xl font-bold text-orange-600 mt-1">{recentOutgoing.length} удаа</h4>
                      </div>
                    </div>
                  </div>
                )}

                {/* 7. EXCEL / ODS ИМПОРТ */}
                {activeMenu === 'Excel / ODS импорт' && (
                  <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm max-w-2xl mx-auto">
                    <h3 className="text-xl font-bold text-slate-800 mb-2">Excel эсвэл ODS файлаас дата унших</h3>
                    <p className="text-slate-500 text-sm mb-6">Баганы бүтэц зүүнээс баруун тийшээ: **[1: Нэр, 2: Код, 3: Тоо, 4: Нийлүүлэгч]** дарааллаар уншигдана.</p>
                    <div className="border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-2xl p-10 text-center relative bg-slate-50">
                      <input type="file" accept=".xlsx, .xls, .ods" onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer w-full h-full" />
                      <span className="text-4xl block mb-2">📊</span>
                      <p className="font-medium text-slate-700">Файлаа сонгох эсвэл энд чирч авчирна уу</p>
                    </div>
                  </div>
                )}

                {/* 8. ХЭРЭГЛЭГЧИД */}
                {activeMenu === 'Хэрэглэгчид' && (
                  <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                    <table className="w-full text-sm">
                      <thead>
                        <tr className="text-left border-b border-slate-200 text-slate-500">
                          <th className="pb-3">Нэр</th><th className="pb-3">Үүрэг</th><th className="pb-3">И-мэйл</th><th className="pb-3">Утас</th>
                        </tr>
                      </thead>
                      <tbody>
                        {users.map((user, i) => (
                          <tr key={i} className="border-b border-slate-100">
                            <td className="py-3 font-medium">{user.name}</td>
                            <td><span className="px-2 py-1 text-xs font-semibold bg-blue-50 text-blue-700 rounded-lg">{user.role}</span></td>
                            <td>{user.email}</td>
                            <td>{user.phone}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}

                {/* 9. ТОХИРГОО */}
                {activeMenu === 'Тохиргоо' && (
                  <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                    <h3 className="text-lg font-bold text-slate-800 mb-4">Системийн тохиргоо</h3>
                    <div className="space-y-4 max-w-md">
                      <div>
                        <label className="block text-sm text-slate-600 mb-1">Компанийн нэр</label>
                        <input type="text" defaultValue="Best Shoes LLC" className="w-full border border-slate-300 rounded-xl px-4 py-2 text-sm" disabled />
                      </div>
                      <div>
                        <label className="block text-sm text-slate-600 mb-1">Агуулахын байршил</label>
                        <input type="text" defaultValue="Улаанбаатар, Үндсэн үйлдвэр" className="w-full border border-slate-300 rounded-xl px-4 py-2 text-sm" disabled />
                      </div>
                    </div>
                  </div>
                )}
              </main>

              {/* ХОП-АП ФОРМ (ШИНЭ ОРЛОГО) */}
              {isModalOpen && (
                <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                  <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-xl">
                    <h3 className="text-xl font-bold text-slate-800 mb-4">Шинэ орлого бүртгэх</h3>
                    <form onSubmit={handleAddIncoming} className="space-y-4">
                      <div><label className="block text-sm text-slate-600 mb-1">Сэлбэг, барааны нэр</label><input type="text" value={newName} onChange={(e) => setNewName(e.target.value)} className="w-full border border-slate-300 rounded-xl px-4 py-2 text-sm" placeholder="Жишээ: Ажлын бээлий" /></div>
                      <div><label className="block text-sm text-slate-600 mb-1">Дотоод код</label><input type="text" value={newCode} onChange={(e) => setNewCode(e.target.value)} className="w-full border border-slate-300 rounded-xl px-4 py-2 text-sm" placeholder="Жишээ: GLV-002" /></div>
                      <div><label className="block text-sm text-slate-600 mb-1">Тоо ширхэг</label><input type="number" value={newQty} onChange={(e) => setNewQty(e.target.value)} className="w-full border border-slate-300 rounded-xl px-4 py-2 text-sm" /></div>
                      <div><label className="block text-sm text-slate-600 mb-1">Нийлүүлэгч компани</label><input type="text" value={newSupplier} onChange={(e) => setNewSupplier(e.target.value)} className="w-full border border-slate-300 rounded-xl px-4 py-2 text-sm" placeholder="Нийлүүлэгч" /></div>
                      <div className="flex gap-3 pt-2 justify-end">
                        <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 bg-slate-200 text-slate-700 rounded-xl text-sm font-medium">Цуцлах</button>
                        <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded-xl text-sm font-medium">Хадгалах</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<InventoryDashboard />);
    </script>
</body>
</html>
