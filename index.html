<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best Shoes - Агуулахын ухаалаг Excel систем</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        /* Excel нүдний загвар */
        .excel-cell {
            border: 1px solid #cbd5e1;
            padding: 0;
            min-width: 130px;
            height: 34px;
            position: relative;
            user-select: none;
        }
        .excel-input {
            width: 100%;
            height: 100%;
            padding: 6px 10px;
            border: none;
            outline: none;
            background: transparent;
            font-size: 13px;
            color: #334155;
        }
        /* Идэвхжүүлсэн (Selected) нүдний цэнхэр стайл */
        .cell-selected {
            background-color: rgba(14, 165, 233, 0.15) !important;
            box-shadow: inset 0 0 0 1px #0ea5e9;
        }
        /* Одоогийн фокустай байгаа нүд */
        .excel-input:focus {
            background-color: #ffffff;
            box-shadow: inset 0 0 0 2px #16a34a;
            z-index: 10;
        }
        /* Баруун товчны цэс */
        .excel-context-menu {
            position: absolute;
            z-index: 9999;
            background: white;
            border: 1px solid #cbd5e1;
            box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            border-radius: 8px;
            padding: 6px;
            width: 210px;
            font-size: 13px;
        }
        .excel-context-menu button {
            width: 100%;
            text-align: left;
            padding: 6px 12px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .excel-context-menu button:hover {
            background-color: #f1f5f9;
        }
    </style>
</head>
<body class="bg-slate-100 antialiased text-slate-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function IntegratedExcelApp() {
          // --- 1. НЭВТРЭХ СИСТЕМ ---
          const [isLoggedIn, setIsLoggedIn] = useState(false);
          const [password, setPassword] = useState('');
          const [systemPassword, setSystemPassword] = useState('9761'); 
          const [newPasswordInput, setNewPasswordInput] = useState('');

          // --- 2. НАВИГАЦИ & ХАЙЛТ ---
          const [activeMenu, setActiveMenu] = useState('Сэлбэгийн бүртгэл');
          const [searchTerm, setSearchTerm] = useState('');
          
          // --- 3. EXCEL МӨР БАГАНЫН ӨГӨГДӨЛ ---
          const [headers, setHeaders] = useState([
            { id: 'h1', label: 'Барааны нэр', visible: true },
            { id: 'h2', label: 'Материалын код', visible: true },
            { id: 'h3', label: 'Орлого (Тоо)', visible: true },
            { id: 'h4', label: 'Зарлага (Тоо)', visible: true },
            { id: 'h5', label: 'Үлдэгдэл', visible: true },
            { id: 'h6', label: 'Нийлүүлэгч / Тасаг', visible: true }
          ]);

          const [matrix, setMatrix] = useState([
            ['Пүрш', 'SPR-001', '120', '20', '100', 'Блю Стар ХХК'],
            ['Боолт M10', 'BLT-010', '500', '50', '450', 'Техно Импекс'],
            ['LED гэрэл 50W', 'LED-050', '30', '0', '30', 'Электро Сервис'],
            ['Ажлын бээлий', 'GLV-002', '200', '15', '185', 'Дотоод Сорс'],
          ]);

          // --- 4. ХУЛГАНААР ОЛОН НҮД ИДЭВХЖҮҮЛЭХ (SELECTION) ЛОГИК ---
          const [isSelecting, setIsSelecting] = useState(false);
          const [selectionStart, setSelectionStart] = useState(null); // {r, c}
          const [selectionEnd, setSelectionEnd] = useState(null);     // {r, c}
          const [selectAll, setSelectAll] = useState(false);

          // --- 5. БАРУУН ТОВЧНЫ ЦЭС (CONTEXT MENU) ---
          const [contextMenu, setContextMenu] = useState({ visible: false, x: 0, y: 0, rIdx: null, cIdx: null });

          // Орлого / Зарлагын модаль цонх
          const [isIncomingModalOpen, setIsIncomingModalOpen] = useState(false);
          const [isOutgoingModalOpen, setIsOutgoingModalOpen] = useState(false);
          const [modalForm, setModalForm] = useState({ name: '', code: '', qty: '', extra: '' });

          // Автомат Үлдэгдэл бодох томьёо (Үлдэгдэл багана нь үргэлж 4 дэх индекс дээр байна гэж тооцов)
          useEffect(() => {
            const updated = matrix.map(row => {
              const inc = parseFloat(row[2]) || 0;
              const out = parseFloat(row[3]) || 0;
              const rem = inc - out;
              const newRow = [...row];
              // Хэрэв хүснэгтийн баганы бүтэц өөрчлөгдөөгүй бол 4-ийг бодно
              if(newRow.length > 4) {
                newRow[4] = rem.toString();
              }
              return newRow;
            });
            if (JSON.stringify(updated) !== JSON.stringify(matrix)) {
              setMatrix(updated);
            }
          }, [matrix]);

          // Нэвтрэх удирдамж
          const handleLogin = (e) => {
            e.preventDefault();
            if (password === systemPassword) {
              setIsLoggedIn(true);
            } else {
              alert('Нууц үг буруу байна!');
            }
          };

          // Код өөрчлөх
          const handlePasswordChange = (e) => {
            e.preventDefault();
            if (newPasswordInput.trim().length > 0) {
              setSystemPassword(newPasswordInput.trim());
              alert(`Нууц үг амжилттай солигдлоо: ${newPasswordInput.trim()}`);
              setNewPasswordInput('');
            }
          };

          // --- ХУЛГАНААР ИДЭВХЖҮҮЛЭХ ФУНКЦҮҮД ---
          const handleMouseDown = (rIdx, cIdx, e) => {
            if (e.button === 2) return; // Баруун товч дарахад selection эвдэхгүй
            setSelectAll(false);
            setIsSelecting(true);
            setSelectionStart({ r: rIdx, c: cIdx });
            setSelectionEnd({ r: rIdx, c: cIdx });
          };

          const handleMouseEnter = (rIdx, cIdx) => {
            if (!isSelecting) return;
            setSelectionEnd({ r: rIdx, c: cIdx });
          };

          const handleMouseUp = () => {
            setIsSelecting(false);
          };

          // Нүд идэвхжсэн эсэхийг шалгах харагдац
          const isCellSelected = (rIdx, cIdx) => {
            if (selectAll) return true;
            if (!selectionStart || !selectionEnd) return false;
            
            const startR = Math.min(selectionStart.r, selectionEnd.r);
            const endR = Math.max(selectionStart.r, selectionEnd.r);
            const startC = Math.min(selectionStart.c, selectionEnd.c);
            const endC = Math.max(selectionStart.c, selectionEnd.c);

            return rIdx >= startR && rIdx <= endR && cIdx >= startC && cIdx <= endC;
          };

          // Бүх нүдийг сонгох (Зүүн дээд буланд дарах)
          const triggerSelectAll = () => {
            setSelectionStart(null);
            setSelectionEnd(null);
            setSelectAll(true);
          };

          // Хүснэгтийн утга шууд бичиж өөрчлөх
          const handleInputChange = (value, rIdx, cIdx) => {
            const updated = [...matrix];
            updated[rIdx][cIdx] = value;
            setMatrix(updated);
          };

          // --- БАРУУН ТОВЧНЫ ЦЭСНИЙ ҮЙЛДЛҮҮД ---
          const handleCellContextMenu = (e, rIdx, cIdx) => {
            e.preventDefault();
            setContextMenu({
              visible: true,
              x: e.pageX,
              y: e.pageY,
              rIdx,
              cIdx
            });
          };

          // Мөр нэмэх устгах (Хулганы үйлдлээр)
          const insertRow = (direction) => {
            const { rIdx } = contextMenu;
            if (rIdx === null) return;
            const newRow = Array(headers.length).fill('');
            const updated = [...matrix];
            if (direction === 'above') {
              updated.splice(rIdx, 0, newRow);
            } else {
              updated.splice(rIdx + 1, 0, newRow);
            }
            setMatrix(updated);
            closeContextMenu();
          };

          const deleteRow = () => {
            const { rIdx } = contextMenu;
            if (rIdx === null || matrix.length <= 1) return;
            const updated = [...matrix];
            updated.splice(rIdx, 1);
            setMatrix(updated);
            closeContextMenu();
          };

          // Багана нэмэх устгах (Хулганы үйлдлээр)
          const insertColumn = (direction) => {
            const { cIdx } = contextMenu;
            if (cIdx === null) return;
            const label = prompt("Шинэ баганын нэрийг оруулна уу:", "Шинэ багана");
            if (!label) return;

            const newHeader = { id: 'col_' + Date.now(), label, visible: true };
            const updatedHeaders = [...headers];
            const targetIdx = direction === 'left' ? cIdx : cIdx + 1;

            updatedHeaders.splice(targetIdx, 0, newHeader);
            setHeaders(updatedHeaders);

            const updatedMatrix = matrix.map(row => {
              const r = [...row];
              r.splice(targetIdx, 0, '');
              return r;
            });
            setMatrix(updatedMatrix);
            closeContextMenu();
          };

          const deleteColumn = () => {
            const { cIdx } = contextMenu;
            if (cIdx === null || headers.filter(h => h.visible).length <= 1) return;
            
            const updatedHeaders = [...headers];
            updatedHeaders.splice(cIdx, 1);
            setHeaders(updatedHeaders);

            const updatedMatrix = matrix.map(row => {
              const r = [...row];
              r.splice(cIdx, 1);
              return r;
            });
            setMatrix(updatedMatrix);
            closeContextMenu();
          };

          // Багана нуух (Hide)
          const hideCurrentColumn = () => {
            const { cIdx } = contextMenu;
            if (cIdx === null) return;
            const updated = [...headers];
            updated[cIdx].visible = false;
            setHeaders(updated);
            closeContextMenu();
          };

          const unhideAllColumns = () => {
            setHeaders(headers.map(h => ({ ...h, visible: true })));
          };

          const closeContextMenu = () => {
            setContextMenu({ ...contextMenu, visible: false });
          };

          // --- ОРЛОГО ЗАРЛАГА ОРУУЛАХ БУСАД ФУНКЦҮҮД ---
          const submitIncoming = (e) => {
            e.preventDefault();
            if (!modalForm.name || !modalForm.qty) return;
            setMatrix([[modalForm.name, modalForm.code || '---', modalForm.qty, '0', modalForm.qty, modalForm.extra || 'Шинэ бараа'], ...matrix]);
            setIsIncomingModalOpen(false);
            setModalForm({ name: '', code: '', qty: '', extra: '' });
          };

          const submitOutgoing = (e) => {
            e.preventDefault();
            if (!modalForm.name || !modalForm.qty) return;
            setMatrix([[modalForm.name, modalForm.code || '---', '0', modalForm.qty, '0', modalForm.extra || 'Үйлдвэр тасаг'], ...matrix]);
            setIsOutgoingModalOpen(false);
            setModalForm({ name: '', code: '', qty: '', extra: '' });
          };

          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
              try {
                const bstr = evt.target.result;
                const wb = XLSX.read(bstr, { type: 'binary' });
                if (wb.SheetNames.length > 0) {
                  const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                  if (data.length > 0) {
                    setHeaders(data[0].map((h, i) => ({ id: `w_${i}`, label: h || `Багана ${i+1}`, visible: true })));
                    setMatrix(data.slice(1).filter(r => r.length > 0));
                  }
                }
                alert("Excel амжилттай импортлогдлоо!");
              } catch (err) { alert("Файл уншихад алдаа гарлаа."); }
            };
            reader.readAsBinaryString(file);
          };

          const filteredRows = () => {
            if (!searchTerm.trim()) return matrix;
            return matrix.filter(r => r.some(c => c?.toString().toLowerCase().includes(searchTerm.toLowerCase().trim())));
          };

          const totalIn = matrix.reduce((s, r) => s + (parseFloat(r[2]) || 0), 0);
          const totalOut = matrix.reduce((s, r) => s + (parseFloat(r[3]) || 0), 0);
          const totalStock = matrix.reduce((s, r) => s + (parseFloat(r[4]) || 0), 0);

          // 🔒 ЛОГИН ХУУДАС
          if (!isLoggedIn) {
            return (
              <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center space-y-5">
                  <h1 className="text-2xl font-black text-slate-800 tracking-wider">BEST SHOES</h1>
                  <p className="text-slate-400 text-xs">Үйлдвэр агуулахын ухаалаг систем</p>
                  <form onSubmit={handleLogin} className="space-y-4 text-left">
                    <div>
                      <label className="text-xs font-bold text-slate-500 block mb-1">Нэвтрэх код</label>
                      <input 
                        type="password" 
                        placeholder="••••" 
                        required 
                        value={password} 
                        onChange={(e) => setPassword(e.target.value)} 
                        className="w-full border border-slate-300 p-3 rounded-xl text-sm outline-none focus:border-blue-500" 
                      />
                    </div>
                    <button type="submit" className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold p-3 rounded-xl text-sm transition shadow-md">
                      Систем рүү нэвтрэх
                    </button>
                  </form>
                </div>
              </div>
            );
          }

          // 💻 ҮНДСЭН ХУУЧИН ЗАГВАР СУУРЬТАЙ ОРЧИН
          return (
            <div className="min-h-screen flex bg-slate-100" onClick={closeContextMenu} onMouseUp={handleMouseUp}>
              
              {/* ЗҮҮН ТАЛЫН ХУУЧИН ХАР ЦЭС */}
              <aside className="w-64 bg-slate-900 text-white p-6 hidden md:flex flex-col shadow-xl select-none">
                <div className="mb-8">
                  <h1 className="text-xl font-bold tracking-wider text-blue-400">BEST SHOES</h1>
                  <p className="text-slate-400 text-xs mt-0.5">Үйлдвэрлэл & Хяналт</p>
                </div>
                <nav className="space-y-1 flex-1">
                  {[
                    { name: 'Сэлбэгийн бүртгэл', icon: '🔧' },
                    { name: 'Excel / ODS импорт', icon: '📁' },
                    { name: 'Тохиргоо', icon: '⚙️' }
                  ].map((item) => (
                    <div 
                      key={item.name} 
                      onClick={() => setActiveMenu(item.name)}
                      className={`p-3 rounded-xl cursor-pointer transition flex items-center gap-3 text-sm font-medium ${activeMenu === item.name ? 'bg-blue-600 text-white shadow-md' : 'hover:bg-slate-800 text-slate-300'}`}
                    >
                      <span>{item.icon}</span><span>{item.name}</span>
                    </div>
                  ))}
                </nav>
                <div className="pt-4 border-t border-slate-800">
                  <button onClick={() => setIsLoggedIn(false)} className="w-full bg-slate-800 hover:bg-red-950 text-slate-300 hover:text-red-300 text-xs py-2 rounded-lg transition font-medium">🚪 Гарах</button>
                </div>
              </aside>

              {/* БАРУУН ТАЛЫН ҮНДСЭН АЖЛЫН ХЭСЭГ */}
              <main className="flex-1 p-6 overflow-y-auto flex flex-col">
                
                {/* ДЭЭД ХЭСЭГ */}
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                  <div>
                    <h2 className="text-xl font-bold text-slate-800">{activeMenu}</h2>
                    <p className="text-slate-400 text-xs mt-0.5">Хүснэгтийн нүднүүд дээр хулганы баруун товчийг дарж Excel цэсийг нээнэ үү.</p>
                  </div>
                  <div className="flex flex-wrap gap-2 w-full md:w-auto">
                    <input 
                      type="text" 
                      placeholder="Эндээс хайна уу..." 
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="px-4 py-2 rounded-xl border border-slate-300 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 w-full md:w-48"
                    />
                    <button onClick={() => setIsIncomingModalOpen(true)} className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-xl text-xs font-semibold shadow transition">+ Орлого</button>
                    <button onClick={() => setIsOutgoingModalOpen(true)} className="bg-orange-600 hover:bg-orange-700 text-white px-3 py-2 rounded-xl text-xs font-semibold shadow transition">- Зарлага</button>
                  </div>
                </div>

                {/* ТОП СҮҮЛҮҮД (Нэгдсэн тооцоолол) */}
                {activeMenu === 'Сэлбэгийн бүртгэл' && (
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                    <div className="bg-white p-4 rounded-xl border border-slate-200 text-center">
                      <p className="text-slate-400 text-xs font-bold uppercase">Нийт Орлого</p>
                      <h3 className="text-xl font-black mt-1 text-blue-600">{totalIn.toLocaleString()} ш</h3>
                    </div>
                    <div className="bg-white p-4 rounded-xl border border-slate-200 text-center">
                      <p className="text-slate-400 text-xs font-bold uppercase">Нийт Зарлага</p>
                      <h3 className="text-xl font-black mt-1 text-orange-600">{totalOut.toLocaleString()} ш</h3>
                    </div>
                    <div className="bg-white p-4 rounded-xl border border-slate-200 text-center">
                      <p className="text-slate-400 text-xs font-bold uppercase">Бодит Үлдэгдэл</p>
                      <h3 className="text-xl font-black mt-1 text-emerald-600">{totalStock.toLocaleString()} ш</h3>
                    </div>
                  </div>
                )}

                {/* 1. СЭЛБЭГИЙН БҮРТГЭЛ ОДОО ЖИНХЭНЭ EXCEL ШИГ */}
                {activeMenu === 'Сэлбэгийн бүртгэл' && (
                  <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-4">
                    <div className="flex justify-end items-center">
                      <button onClick={unhideAllColumns} className="text-xs text-blue-600 hover:underline font-bold">👁️ Нуусан багануудыг ил гаргах (Unhide All)</button>
                    </div>

                    <div className="overflow-x-auto border border-slate-200 rounded-xl relative">
                      <table className="w-full text-left border-collapse" style={{ tableLayout: 'fixed' }}>
                        <thead>
                          <tr className="bg-slate-50 select-none">
                            {/* Зүүн дээд талын буланд дарахад бүх нүд идэвхжинэ */}
                            <th onClick={triggerSelectAll} className="border p-2 text-xs font-bold text-slate-400 bg-slate-100 text-center cursor-pointer hover:bg-slate-200 w-12">◤</th>
                            {headers.map((h, idx) => h.visible && (
                              <th 
                                key={h.id} 
                                onContextMenu={(e) => handleCellContextMenu(e, null, idx)}
                                className="border p-2.5 text-xs font-bold text-slate-600 bg-slate-100 relative truncate"
                              >
                                {h.label}
                              </th>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {filteredRows().map((row, rIdx) => (
                            <tr key={rIdx}>
                              {/* Мөрийн дугаар */}
                              <td onContextMenu={(e) => handleCellContextMenu(e, rIdx, null)} className="border p-2 text-xs text-slate-400 text-center bg-slate-50 font-medium select-none">{rIdx + 1}</td>
                              
                              {/* Нүднүүд */}
                              {row.map((cell, cIdx) => headers[cIdx]?.visible && (
                                <td 
                                  key={cIdx} 
                                  onMouseDown={(e) => handleMouseDown(rIdx, cIdx, e)}
                                  onMouseEnter={() => handleMouseEnter(rIdx, cIdx)}
                                  onContextMenu={(e) => handleCellContextMenu(e, rIdx, cIdx)}
                                  className={`excel-cell ${isCellSelected(rIdx, cIdx) ? 'cell-selected' : ''}`}
                                >
                                  <input 
                                    type="text" 
                                    value={cell || ''} 
                                    onChange={(e) => handleInputChange(e.target.value, rIdx, cIdx)}
                                    className="excel-input"
                                  />
                                </td>
                              ))}
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* 2. EXCEL ИМПОРТ */}
                {activeMenu === 'Excel / ODS импорт' && (
                  <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm max-w-md mx-auto text-center space-y-4 my-auto">
                    <span className="text-4xl block">📁</span>
                    <h3 className="text-base font-bold text-slate-800">Файл оруулах хэсэг</h3>
                    <div className="border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-xl p-8 bg-slate-50 relative cursor-pointer transition">
                      <input type="file" accept=".xlsx, .xls, .ods" onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer" />
                      <p className="text-xs font-medium text-slate-600">Сэлбэгийн .ods файлаа сонгоно уу</p>
                    </div>
                  </div>
                )}

                {/* 3. ТОХИРГОО (НУУЦ ҮГ СОЛИХ) */}
                {activeMenu === 'Тохиргоо' && (
                  <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm max-w-md space-y-5">
                    <h4 className="font-bold text-slate-800 text-base">🔐 Нууц үг засах</h4>
                    <form onSubmit={handlePasswordChange} className="space-y-4 text-xs">
                      <div>
                        <label className="text-slate-500 font-semibold block mb-1">Одоогийн код</label>
                        <input type="text" value={systemPassword} disabled className="w-full border p-2.5 rounded-xl bg-slate-50 font-bold" />
                      </div>
                      <div>
                        <label className="text-slate-500 font-semibold block mb-1">Шинээр тавих код</label>
                        <input 
                          type="text" 
                          required 
                          placeholder="Шинэ код оруулна уу..."
                          value={newPasswordInput} 
                          onChange={(e) => setNewPasswordInput(e.target.value)} 
                          className="w-full border p-2.5 rounded-xl outline-none focus:border-blue-500 font-medium" 
                        />
                      </div>
                      <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2.5 rounded-xl transition shadow">Хадгалах</button>
                    </form>
                  </div>
                )}

              </main>

              {/* 🖱️ ХУЛГАНЫ БАРУУН ТОВЧНЫ EXCEL УХААЛАГ ЦЭС */}
              {contextMenu.visible && (
                <div className="excel-context-menu" style={{ top: contextMenu.y, left: contextMenu.x }} onClick={(e) => e.stopPropagation()}>
                  <button onClick={() => insertRow('above')} className="text-slate-700 hover:text-blue-600">➕ Дээр мөр нэмэх</button>
                  <button onClick={() => insertRow('below')} className="text-slate-700 hover:text-blue-600">➕ Доор мөр нэмэх</button>
                  <button onClick={deleteRow} className="text-red-600 hover:bg-red-50">❌ Энэ мөрийг устгах</button>
                  <hr className="my-1 border-slate-200" />
                  <button onClick={() => insertColumn('left')} className="text-slate-700 hover:text-emerald-600">📐 Зүүн талд багана нэмэх</button>
                  <button onClick={() => insertColumn('right')} className="text-slate-700 hover:text-emerald-600">📐 Баруун талд багана нэмэх</button>
                  <button onClick={deleteColumn} className="text-red-600 hover:bg-red-50">🗑️ Энэ баганыг устгах</button>
                  <hr className="my-1 border-slate-200" />
                  <button onClick={hideCurrentColumn} className="text-slate-500 font-medium">👁️‍🗨️ Баганыг нуух (Hide)</button>
                </div>
              )}

              {/* ОРЛОГЫН ЦОНХ */}
              {isIncomingModalOpen && (
                <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center p-4 z-50 backdrop-blur-xs">
                  <div className="bg-white rounded-2xl p-5 max-w-sm w-full shadow-2xl">
                    <h4 className="font-bold text-slate-800 text-sm mb-3">📥 Шинэ орлого бүртгэх</h4>
                    <form onSubmit={submitIncoming} className="space-y-3 text-xs">
                      <div><label className="block mb-1 font-medium">Барааны нэр *</label><input type="text" required value={modalForm.name} onChange={e => setModalForm({...modalForm, name: e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                      <div><label className="block mb-1 font-medium">Код</label><input type="text" value={modalForm.code} onChange={e => setModalForm({...modalForm, code: e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                      <div><label className="block mb-1 font-medium">Тоо ширхэг *</label><input type="number" required value={modalForm.qty} onChange={e => setModalForm({...modalForm, qty: e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                      <div><label className="block mb-1 font-medium">Нийлүүлэгч</label><input type="text" value={modalForm.extra} onChange={e => setModalForm({...modalForm, extra: e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                      <div className="flex gap-2 justify-end pt-2">
                        <button type="button" onClick={() => setIsIncomingModalOpen(false)} className="bg-slate-100 px-3 py-2 rounded-xl">Цуцлах</button>
                        <button type="submit" className="bg-blue-600 text-white px-3 py-2 rounded-xl font-bold">Орлогодох</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {/* ЗАРЛАГЫН ЦОНХ */}
              {isOutgoingModalOpen && (
                <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center p-4 z-50 backdrop-blur-xs">
                  <div className="bg-white rounded-2xl p-5 max-w-sm w-full shadow-2xl">
                    <h4 className="font-bold text-slate-800 text-sm mb-3">📤 Зарлагын хуудас үүсгэх</h4>
                    <form onSubmit={submitOutgoing} className="space-y-3 text-xs">
                      <div><label className="block mb-1 font-medium">Барааны нэр *</label><input type="text" required value={modalForm.name} onChange={e => setModalForm({...modalForm, name: e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                      <div><label className="block mb-1 font-medium">Код</label><input type="text" value={modalForm.code} onChange={e => setModalForm({...modalForm, code: e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                      <div><label className="block mb-1 font-medium">Тоо ширхэг *</label><input type="number" required value={modalForm.qty} onChange={e => setModalForm({...modalForm, qty: e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                      <div><label className="block mb-1 font-medium">Тасаг хэлтэс</label><input type="text" value={modalForm.extra} onChange={e => setModalForm({...modalForm, extra: e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                      <div className="flex gap-2 justify-end pt-2">
                        <button type="button" onClick={() => setIsOutgoingModalOpen(false)} className="bg-slate-100 px-3 py-2 rounded-xl">Цуцлах</button>
                        <button type="submit" className="bg-orange-600 text-white px-3 py-2 rounded-xl font-bold">Зарлагадах</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<IntegratedExcelApp />);
    </script>
</body>
</html>
