<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best Shoes - Агуулахын Мэргэжлийн Excel Систем</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        .excel-cell {
            border: 1px solid #cbd5e1;
            padding: 0;
            height: 34px;
            position: relative;
            user-select: none;
        }
        .excel-input {
            width: 100%;
            height: 100%;
            padding: 6px 10px;
            border: none;
            outline: none;
            background: transparent;
            font-size: 13px;
            color: #334155;
        }
        .cell-selected {
            background-color: rgba(14, 165, 233, 0.18) !important;
            box-shadow: inset 0 0 0 1px #0ea5e9;
        }
        .excel-input:focus {
            background-color: #ffffff;
            box-shadow: inset 0 0 0 2px #16a34a;
            z-index: 10;
        }
        .excel-context-menu {
            position: absolute;
            z-index: 9999;
            background: white;
            border: 1px solid #cbd5e1;
            box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.1);
            border-radius: 8px;
            padding: 6px;
            width: 230px;
            font-size: 13px;
        }
        .excel-context-menu button {
            width: 100%;
            text-align: left;
            padding: 6px 12px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .excel-context-menu button:hover {
            background-color: #f1f5f9;
        }
        .col-resize-handle {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            cursor: col-resize;
            user-select: none;
        }
        .col-resize-handle:hover {
            background-color: #0ea5e9;
        }
    </style>
</head>
<body class="bg-slate-100 antialiased text-slate-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function IntegratedExcelApp() {
          // --- 1. СИСТЕМД НЭВТРЭХ ---
          const [isLoggedIn, setIsLoggedIn] = useState(false);
          const [password, setPassword] = useState('');
          const [systemPassword, setSystemPassword] = useState('9761'); 
          const [newPasswordInput, setNewPasswordInput] = useState('');

          // --- 2. НАВИГАЦИ ---
          const [activeMenu, setActiveMenu] = useState('Сэлбэгийн бүртгэл');
          
          // --- 3. EXCEL-ИЙН ОЛОН ХУУДАС (3-р зургийн 4-р мөрөөр шинэчлэгдсэн баганууд) ---
          const [currentSheet, setCurrentSheet] = useState('2026-01');
          
          // Баганы жинхэнэ нэрс (Зургийн дагуу зассан бүтэц)
          const [headers, setHeaders] = useState([
            { id: 'c1', label: 'Сэлбэг хэрэгслийн нэрс', visible: true, width: 220 },
            { id: 'c2', label: 'Марка, марк дугаар', visible: true, width: 150 },
            { id: 'c3', label: 'Хэмжих нэгж', visible: true, width: 100 },
            { id: 'c4', label: 'Эхний үлдэгдэл', visible: true, width: 120 },
            { id: 'c5', label: 'Орлого', visible: true, width: 100 },
            { id: 'c6', label: 'Зарлага', visible: true, width: 100 },
            { id: 'c7', label: 'Эцсийн үлдэгдэл', visible: true, width: 120 },
            { id: 'c8', label: 'Тайлант хугацаанд авсан өгсөн тасаг цех', visible: true, width: 250 }
          ]);

          const [sheets, setSheets] = useState({
            '2026-01': [
              ['Оёдол пүрш маск', 'OP-2026', 'ш', '100', '50', '20', '130', 'Оёдлын тасаг'],
              ['Хот мелт цавууны хошуу', 'HM-09', 'ш', '20', '10', '5', '25', 'Механик цех']
            ],
            '2026-02': [],
            '2026-03': [],
            '2026-04': [],
            '2026-05': []
          });

          // --- 4. SELECTION & SHORTCUTS ---
          const [isSelecting, setIsSelecting] = useState(false);
          const [selectionStart, setSelectionStart] = useState(null); 
          const [selectionEnd, setSelectionEnd] = useState(null);     
          const [selectAll, setSelectAll] = useState(false);
          const [copiedData, setCopiedData] = useState(null);

          // --- 5. ЦЭСНИЙ ТӨЛӨВ ---
          const [contextMenu, setContextMenu] = useState({ visible: false, x: 0, y: 0, rIdx: null, cIdx: null, type: 'cell' });
          const [sheetTarget, setSheetTarget] = useState(null);

          // Орлого / Зарлагын модаль цонх
          const [isIncomingModalOpen, setIsIncomingModalOpen] = useState(false);
          const [isOutgoingModalOpen, setIsOutgoingModalOpen] = useState(false);
          const [modalForm, setModalForm] = useState({ name: '', code: '', qty: '', extra: '', initial: '0' });

          const matrix = sheets[currentSheet] || [];

          // Эцсийн үлдэгдлийг автоматаар бодох ухаалаг Excel томьёо (Эхний үлдэгдэл + Орлого - Зарлага = Эцсийн үлдэгдэл)
          useEffect(() => {
            const currentData = sheets[currentSheet];
            if (!currentData) return;

            const updated = currentData.map(row => {
              const initStock = parseFloat(row[3]) || 0; // Эхний үлдэгдэл
              const income = parseFloat(row[4]) || 0;    // Орлого
              const outcome = parseFloat(row[5]) || 0;   // Зарлага
              const finalStock = initStock + income - outcome; // Эцсийн үлдэгдэл
              
              const newRow = [...row];
              if (newRow.length >= 7) {
                newRow[6] = finalStock.toString();
              }
              return newRow;
            });

            if (JSON.stringify(updated) !== JSON.stringify(currentData)) {
              setSheets({ ...sheets, [currentSheet]: updated });
            }
          }, [matrix, currentSheet]);

          // EXCEL ТҮРГЭН ТОВЧЛУУРУУД (Ctrl+C, Ctrl+V, Delete)
          useEffect(() => {
            const handleKeyDown = (e) => {
              if (!selectionStart || !selectionEnd) return;
              
              const startR = Math.min(selectionStart.r, selectionEnd.r);
              const endR = Math.max(selectionStart.r, selectionEnd.r);
              const startC = Math.min(selectionStart.c, selectionEnd.c);
              const endC = Math.max(selectionStart.c, selectionEnd.c);

              if (e.key === 'Delete' || e.key === 'Backspace') {
                if (document.activeElement.tagName === 'INPUT') return;
                e.preventDefault();
                const updated = [...matrix];
                for (let r = startR; r <= endR; r++) {
                  for (let c = startC; c <= endC; c++) {
                    if (updated[r]) updated[r][c] = '';
                  }
                }
                setSheets({ ...sheets, [currentSheet]: updated });
              }

              if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
                if (document.activeElement.tagName === 'INPUT') return;
                e.preventDefault();
                let subGrid = [];
                for (let r = startR; r <= endR; r++) {
                  let rowCells = [];
                  for (let c = startC; c <= endC; c++) {
                    rowCells.push(matrix[r]?.[c] || '');
                  }
                  subGrid.push(rowCells);
                }
                setCopiedData(subGrid);
              }

              if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') {
                if (document.activeElement.tagName === 'INPUT') return;
                if (!copiedData) return;
                e.preventDefault();
                const updated = [...matrix];
                copiedData.forEach((rowCells, rOffset) => {
                  rowCells.forEach((val, cOffset) => {
                    const targetR = startR + rOffset;
                    const targetC = startC + cOffset;
                    if (!updated[targetR]) updated[targetR] = Array(headers.length).fill('');
                    if (targetC < headers.length) {
                      updated[targetR][targetC] = val;
                    }
                  });
                });
                setSheets({ ...sheets, [currentSheet]: updated });
              }
            };

            window.addEventListener('keydown', handleKeyDown);
            return () => window.removeEventListener('keydown', handleKeyDown);
          }, [selectionStart, selectionEnd, matrix, copiedData, currentSheet]);

          // БАГАНЫ ӨРГӨН ЧИРЧ ӨӨРЧЛӨХ
          const handleResizeMouseDown = (idx, e) => {
            e.preventDefault();
            const startX = e.pageX;
            const startWidth = headers[idx].width || 120;

            const handleMouseMove = (moveEvent) => {
              const currentX = moveEvent.pageX;
              const newWidth = Math.max(60, startWidth + (currentX - startX));
              const updatedHeaders = [...headers];
              updatedHeaders[idx].width = newWidth;
              setHeaders(updatedHeaders);
            };

            const handleMouseUp = () => {
              window.removeEventListener('mousemove', handleMouseMove);
              window.removeEventListener('mouseup', handleMouseUp);
            };

            window.addEventListener('mousemove', handleMouseMove);
            window.addEventListener('mouseup', handleMouseUp);
          };

          // ШЭЭТ (SHEET) УДИРДЛАГА
          const addNewMonthSheet = () => {
            const monthName = prompt("Шинэ сар / хуудасны нэрийг оруулна уу (Жишээ нь: 2026-06):", "2026-06");
            if (!monthName) return;
            if (sheets[monthName]) return alert("Энэ хуудас аль хэдийн үүссэн байна!");
            setSheets({ ...sheets, [monthName]: [] });
            setCurrentSheet(monthName);
          };

          const handleSheetContextMenu = (e, sheetName) => {
            e.preventDefault();
            setSheetTarget(sheetName);
            setContextMenu({ visible: true, x: e.pageX, y: e.pageY, rIdx: null, cIdx: null, type: 'sheet' });
          };

          const renameSheet = () => {
            if (!sheetTarget) return;
            const newName = prompt(`"${sheetTarget}" хуудасны шинэ нэр:`, sheetTarget);
            if (!newName || newName === sheetTarget) return;
            if (sheets[newName]) return alert("Ийм нэртэй хуудас байна!");
            
            const updatedSheets = { ...sheets };
            updatedSheets[newName] = updatedSheets[sheetTarget];
            delete updatedSheets[sheetTarget];
            setSheets(updatedSheets);
            if (currentSheet === sheetTarget) setCurrentSheet(newName);
          };

          const deleteSheet = () => {
            if (!sheetTarget) return;
            if (Object.keys(sheets).length <= 1) return alert("Ганц үлдсэн хуудсыг устгах боломжгүй!");
            if (confirm(`"${sheetTarget}" хуудсыг бүрмөсөн устгах уу?`)) {
              const updatedSheets = { ...sheets };
              delete updatedSheets[sheetTarget];
              setSheets(updatedSheets);
              setCurrentSheet(Object.keys(updatedSheets)[0]);
            }
          };

          // ХУЛГАНААР ИДЭВХЖҮҮЛЭХ
          const handleMouseDown = (rIdx, cIdx, e) => {
            if (e.button === 2) return; 
            setSelectAll(false);
            setIsSelecting(true);
            setSelectionStart({ r: rIdx, c: cIdx });
            setSelectionEnd({ r: rIdx, c: cIdx });
          };

          const handleMouseEnter = (rIdx, cIdx) => {
            if (!isSelecting) return;
            setSelectionEnd({ r: rIdx, c: cIdx });
          };

          const isCellSelected = (rIdx, cIdx) => {
            if (selectAll) return true;
            if (!selectionStart || !selectionEnd) return false;
            const startR = Math.min(selectionStart.r, selectionEnd.r);
            const endR = Math.max(selectionStart.r, selectionEnd.r);
            const startC = Math.min(selectionStart.c, selectionEnd.c);
            const endC = Math.max(selectionStart.c, selectionEnd.c);
            return rIdx >= startR && rIdx <= endR && cIdx >= startC && cIdx <= endC;
          };

          const handleInputChange = (value, rIdx, cIdx) => {
            const updatedMatrix = [...matrix];
            if (!updatedMatrix[rIdx]) updatedMatrix[rIdx] = Array(headers.length).fill('');
            updatedMatrix[rIdx][cIdx] = value;
            setSheets({ ...sheets, [currentSheet]: updatedMatrix });
          };

          const handleCellContextMenu = (e, rIdx, cIdx) => {
            e.preventDefault();
            setContextMenu({ visible: true, x: e.pageX, y: e.pageY, rIdx, cIdx, type: 'cell' });
          };

          const insertRow = (direction) => {
            const { rIdx } = contextMenu;
            if (rIdx === null) return;
            const newRow = Array(headers.length).fill('');
            const updated = [...matrix];
            updated.splice(direction === 'above' ? rIdx : rIdx + 1, 0, newRow);
            setSheets({ ...sheets, [currentSheet]: updated });
          };

          const deleteRow = () => {
            const { rIdx } = contextMenu;
            if (rIdx === null) return;
            const updated = [...matrix];
            updated.splice(rIdx, 1);
            setSheets({ ...sheets, [currentSheet]: updated });
          };

          // 📁 EXCEL / ODS ИМПОРТЫН УХААЛАГ СҮҮЛ БАГАНА ТАНИГЧ
          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
              try {
                const bstr = evt.target.result;
                const wb = XLSX.read(bstr, { type: 'binary' });
                const importedSheets = {};
                
                wb.SheetNames.forEach((name) => {
                  const data = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1 });
                  if (data.length > 4) {
                    // 4-р мөрнөөс дооших өгөгдлийг цэвэрлэж авна
                    importedSheets[name] = data.slice(4).map(row => {
                      return [
                        row[1]?.toString() || '', // Сэлбэг хэрэгслийн нэрс
                        row[2]?.toString() || '', // Марк дугаар
                        row[3]?.toString() || 'ш',// Хэмжих нэгж
                        row[4]?.toString() || '0',// Эхний үлдэгдэл
                        row[5]?.toString() || '0',// Орлого
                        row[6]?.toString() || '0',// Зарлага
                        row[7]?.toString() || '0',// Эцсийн үлдэгдэл
                        row[8]?.toString() || ''  // Тасаг цех
                      ];
                    });
                  } else {
                    importedSheets[name] = [];
                  }
                });

                setSheets(importedSheets);
                setCurrentSheet(wb.SheetNames[0]);
                setActiveMenu('Сэлбэгийн бүртгэл');
                alert("Файлыг 4-р мөрний баганы бүтцээр амжилттай хөрвүүлж уншлаа!");
              } catch (err) { 
                alert("Файлыг уншиж чадсангүй, зөв .xlsx эсвэл .ods файл сонгоно уу."); 
              }
            };
            reader.readAsBinaryString(file);
          };

          const handleLogin = (e) => {
            e.preventDefault();
            if (password === systemPassword) setIsLoggedIn(true);
            else alert('Нууц үг буруу байна!');
          };

          // Нийт дүнгийн тооцоо
          const totalInit = matrix.reduce((s, r) => s + (parseFloat(r[3]) || 0), 0);
          const totalIn = matrix.reduce((s, r) => s + (parseFloat(r[4]) || 0), 0);
          const totalOut = matrix.reduce((s, r) => s + (parseFloat(r[5]) || 0), 0);
          const totalFinal = matrix.reduce((s, r) => s + (parseFloat(r[6]) || 0), 0);

          if (!isLoggedIn) {
            return (
              <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center space-y-4">
                  <h1 className="text-2xl font-black text-slate-800 tracking-wider">BEST SHOES</h1>
                  <p className="text-slate-400 text-xs">Агуулахын Мэргэжлийн Сэлбэг Тайлан</p>
                  <form onSubmit={handleLogin} className="space-y-4">
                    <input type="password" placeholder="Нэвтрэх нууц үг" required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full border p-3 rounded-xl text-sm text-center font-bold outline-none focus:border-blue-500" />
                    <button type="submit" className="w-full bg-slate-900 text-white font-bold p-3 rounded-xl text-sm shadow-md cursor-pointer">Нэвтрэх</button>
                  </form>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen flex bg-slate-100" onClick={() => setContextMenu({ ...contextMenu, visible: false })} onMouseUp={() => setIsSelecting(false)}>
              
              {/* ЗҮҮН ТАЛЫН ҮНДСЭН ЦЭС */}
              <aside className="w-64 bg-slate-900 text-white p-6 hidden md:flex flex-col shadow-xl select-none">
                <div className="mb-8">
                  <h1 className="text-xl font-bold tracking-wider text-blue-400">BEST SHOES</h1>
                  <p className="text-slate-400 text-xs mt-0.5">Үйлдвэрлэл & Сэлбэг агуулах</p>
                </div>
                <nav className="space-y-1 flex-1">
                  {[
                    { name: 'Сэлбэгийн бүртгэл', icon: '🔧' },
                    { name: 'Excel / ODS импорт', icon: '📁' },
                    { name: 'Тохиргоо', icon: '⚙️' }
                  ].map((item) => (
                    <div 
                      key={item.name} 
                      onClick={() => setActiveMenu(item.name)}
                      className={`p-3 rounded-xl cursor-pointer transition flex items-center gap-3 text-sm font-medium ${activeMenu === item.name ? 'bg-blue-600 text-white shadow-md' : 'hover:bg-slate-800 text-slate-300'}`}
                    >
                      <span>{item.icon}</span><span>{item.name}</span>
                    </div>
                  ))}
                </nav>
                <div className="pt-4 border-t border-slate-800">
                  <button onClick={() => setIsLoggedIn(false)} className="w-full bg-slate-800 text-slate-300 text-xs py-2 rounded-lg cursor-pointer">🚪 Гарах</button>
                </div>
              </aside>

              {/* БАРУУН ТАЛЫН ҮНДСЭН АЖЛЫН ТАЛБАР */}
              <main className="flex-1 p-6 overflow-y-auto flex flex-col justify-between">
                <div>
                  <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <div>
                      <h2 className="text-xl font-bold text-slate-800">{activeMenu} {activeMenu === 'Сэлбэгийн бүртгэл' && `(${currentSheet})`}</h2>
                      <p className="text-slate-400 text-xs mt-0.5">Зургийн 4-р мөрний дагуу баганы нэрсийг бүрэн шинэчилж, томьёог суулгав.</p>
                    </div>
                    {activeMenu === 'Сэлбэгийн бүртгэл' && (
                      <div className="flex gap-2">
                        <button onClick={() => setIsIncomingModalOpen(true)} className="bg-blue-600 text-white px-3 py-2 rounded-xl text-xs font-semibold shadow cursor-pointer">+ Орлого авах</button>
                        <button onClick={() => setIsOutgoingModalOpen(true)} className="bg-orange-600 text-white px-3 py-2 rounded-xl text-xs font-semibold shadow cursor-pointer">- Зарлага гаргах</button>
                      </div>
                    )}
                  </div>

                  {/* 1. СЭЛБЭГИЙН БҮРТГЭЛ ХҮСНЭГТ */}
                  {activeMenu === 'Сэлбэгийн бүртгэл' && (
                    <>
                      {/* НЭГДҮҮЛСЭН САТ СУУРЬТАЙ ДҮННҮҮД */}
                      <div className="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-4">
                        <div className="bg-white p-4 rounded-xl border border-slate-200 text-center">
                          <p className="text-slate-400 text-xs font-bold uppercase">Эхний үлдэгдэл</p>
                          <h3 className="text-lg font-black mt-1 text-slate-700">{totalInit.toLocaleString()} ш</h3>
                        </div>
                        <div className="bg-white p-4 rounded-xl border border-slate-200 text-center">
                          <p className="text-slate-400 text-xs font-bold uppercase">Нийт Орлого</p>
                          <h3 className="text-lg font-black mt-1 text-blue-600">+{totalIn.toLocaleString()} ш</h3>
                        </div>
                        <div className="bg-white p-4 rounded-xl border border-slate-200 text-center">
                          <p className="text-slate-400 text-xs font-bold uppercase">Нийт Зарлага</p>
                          <h3 className="text-lg font-black mt-1 text-orange-600">-{totalOut.toLocaleString()} ш</h3>
                        </div>
                        <div className="bg-white p-4 rounded-xl border border-slate-200 text-center">
                          <p className="text-slate-400 text-xs font-bold uppercase">Эцсийн Үлдэгдэл</p>
                          <h3 className="text-lg font-black mt-1 text-emerald-600">{totalFinal.toLocaleString()} ш</h3>
                        </div>
                      </div>

                      {/* ЖИНХЭНЭ EXCEL ХҮСНЭГТ */}
                      <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                        <div className="overflow-x-auto border border-slate-200 rounded-xl relative">
                          <table className="w-full text-left border-collapse">
                            <thead>
                              <tr className="bg-slate-50 select-none">
                                <th onClick={() => setSelectAll(!selectAll)} className="border p-2 text-xs text-slate-400 bg-slate-100 text-center cursor-pointer w-12">◤</th>
                                {headers.map((h, idx) => h.visible && (
                                  <th key={h.id} onContextMenu={(e) => handleCellContextMenu(e, null, idx)} style={{ width: h.width || 140 }} className="border p-2.5 text-xs font-bold text-slate-600 bg-slate-100 relative truncate">
                                    {h.label}
                                    <div className="col-resize-handle" onMouseDown={(e) => handleResizeMouseDown(idx, e)}></div>
                                  </th>
                                ))}
                              </tr>
                            </thead>
                            <tbody>
                              {matrix.map((row, rIdx) => (
                                <tr key={rIdx}>
                                  <td className="border p-2 text-xs text-slate-400 text-center bg-slate-50 font-medium select-none">{rIdx + 1}</td>
                                  {headers.map((h, cIdx) => h.visible && (
                                    <td 
                                      key={cIdx} 
                                      onMouseDown={(e) => handleMouseDown(rIdx, cIdx, e)}
                                      onMouseEnter={() => handleMouseEnter(rIdx, cIdx)}
                                      onContextMenu={(e) => handleCellContextMenu(e, rIdx, cIdx)}
                                      className={`excel-cell ${isCellSelected(rIdx, cIdx) ? 'cell-selected' : ''}`}
                                    >
                                      <input 
                                        type="text" 
                                        value={row[cIdx] || ''} 
                                        onChange={(e) => handleInputChange(e.target.value, rIdx, cIdx)}
                                        disabled={cIdx === 6} // Эцсийн үлдэгдэл автоматаар бодогдох тул цоожилно
                                        className={`excel-input ${cIdx === 6 ? 'font-bold text-emerald-600 bg-emerald-50/30' : ''}`}
                                      />
                                    </td>
                                  ))}
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </>
                  )}

                  {/* 2. EXCEL / ODS ФАЙЛ ИМПОРТЛОХ ЦЭС */}
                  {activeMenu === 'Excel / ODS импорт' && (
                    <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm max-w-md mx-auto text-center space-y-4 my-12">
                      <span className="text-4xl block">📁</span>
                      <h3 className="text-base font-bold text-slate-800">Сэлбэгийн файл хуулах</h3>
                      <p className="text-slate-400 text-xs">Та өөрийн файлаа оруулснаар систем автоматаар 4-р мөрний бүтэц рүү хөрвүүлж, сар сарын Sheet-ийг үүсгэнэ.</p>
                      <div className="border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-xl p-8 bg-slate-50 relative cursor-pointer transition">
                        <input type="file" accept=".xlsx, .xls, .ods" onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer" />
                        <p className="text-xs font-medium text-slate-600">Энд дарж файлаа уншуулна уу</p>
                      </div>
                    </div>
                  )}

                  {/* 3. ТОХИРГОО */}
                  {activeMenu === 'Тохиргоо' && (
                    <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm max-w-md space-y-4">
                      <h4 className="font-bold text-slate-800 text-base">🔐 Системийн код солих</h4>
                      <input type="text" placeholder="Шинэ код оруулна уу" value={newPasswordInput} onChange={(e) => setNewPasswordInput(e.target.value)} className="w-full border p-2.5 rounded-xl text-xs" />
                      <button onClick={() => { setSystemPassword(newPasswordInput); alert("Код солигдлоо"); }} className="bg-blue-600 text-white font-bold px-4 py-2 rounded-xl text-xs cursor-pointer">Хадгалах</button>
                    </div>
                  )}
                </div>

                {/* 📊 ДООД ТАЛЫН ОЛОН SHEET УДИРДЛАГА */}
                {activeMenu === 'Сэлбэгийн бүртгэл' && (
                  <div className="mt-4 bg-white p-2.5 border border-slate-200 rounded-xl flex items-center flex-wrap gap-1 select-none shadow-sm">
                    <span className="text-xs font-bold text-slate-400 px-2 uppercase tracking-wider">Сар / Хуудаснууд:</span>
                    <div className="flex flex-wrap gap-1">
                      {Object.keys(sheets).sort().map((sheetName) => (
                        <button
                          key={sheetName}
                          onClick={() => { setCurrentSheet(sheetName); setSelectAll(false); }}
                          onContextMenu={(e) => handleSheetContextMenu(e, sheetName)}
                          className={`text-xs px-4 py-1.5 rounded-lg font-bold border transition cursor-pointer ${currentSheet === sheetName ? 'bg-blue-50 text-blue-600 border-blue-200 shadow-xs' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'}`}
                        >
                          📄 {sheetName}
                        </button>
                      ))}
                    </div>
                    <button onClick={addNewMonthSheet} className="bg-slate-900 hover:bg-slate-800 text-white text-xs px-3 py-1.5 rounded-lg font-bold transition flex items-center gap-1 shadow-xs ml-auto cursor-pointer">➕ Дараах сар (Sheet) нэмэх</button>
                  </div>
                )}
              </main>

              {/* 🖱️ БАРУУН ТОВЧНЫ УХААЛАГ EXCEL ЦЭС */}
              {contextMenu.visible && contextMenu.type === 'cell' && (
                <div className="excel-context-menu" style={{ top: contextMenu.y, left: contextMenu.x }} onClick={(e) => e.stopPropagation()}>
                  <button onClick={() => insertRow('above')}>➕ Дээр мөр нэмэх</button>
                  <button onClick={() => insertRow('below')}>➕ Доор мөр нэмэх</button>
                  <button onClick={deleteRow} className="text-red-600">❌ Энэ мөрийг уустал устгах</button>
                </div>
              )}

              {contextMenu.visible && contextMenu.type === 'sheet' && (
                <div className="excel-context-menu" style={{ top: contextMenu.y, left: contextMenu.x }} onClick={(e) => e.stopPropagation()}>
                  <button onClick={renameSheet}>📝 Сар / Хуудасны нэр өөрчлөх</button>
                  <button onClick={deleteSheet} className="text-red-600 font-bold">🗑️ Энэ сарыг бүрмөсөн устгах</button>
                </div>
              )}

              {/* ОРЛОГО АВАХ МОДАЛЬ ЦОНХ */}
              {isIncomingModalOpen && (
                <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center p-4 z-50 text-xs">
                  <div className="bg-white rounded-2xl p-5 max-w-sm w-full shadow-2xl space-y-3">
                    <h4 className="font-bold text-sm">📥 Шинэ сэлбэгийн орлого авах ({currentSheet})</h4>
                    <input type="text" placeholder="Сэлбэг хэрэгслийн нэрс" required value={modalForm.name} onChange={e => setModalForm({...modalForm, name: e.target.value})} className="w-full border p-2 rounded-xl" />
                    <input type="text" placeholder="Марка, марк дугаар" value={modalForm.code} onChange={e => setModalForm({...modalForm, code: e.target.value})} className="w-full border p-2 rounded-xl" />
                    <input type="text" placeholder="Хэмжих нэгж (ш, м, кг...)" value={modalForm.unit} onChange={e => setModalForm({...modalForm, unit: e.target.value})} className="w-full border p-2 rounded-xl" />
                    <input type="number" placeholder="Эхний үлдэгдэл" value={modalForm.initial} onChange={e => setModalForm({...modalForm, initial: e.target.value})} className="w-full border p-2 rounded-xl" />
                    <input type="number" placeholder="Орлого тоо" required value={modalForm.qty} onChange={e => setModalForm({...modalForm, qty: e.target.value})} className="w-full border p-2 rounded-xl" />
                    <input type="text" placeholder="Авсан өгсөн тасаг цех" value={modalForm.extra} onChange={e => setModalForm({...modalForm, extra: e.target.value})} className="w-full border p-2 rounded-xl" />
                    <div className="flex gap-2 justify-end">
                      <button onClick={() => setIsIncomingModalOpen(false)} className="bg-slate-100 px-3 py-2 rounded-xl">Цуцлах</button>
                      <button onClick={() => { setSheets({...sheets, [currentSheet]: [[modalForm.name, modalForm.code || '---', modalForm.unit || 'ш', modalForm.initial || '0', modalForm.qty, '0', '0', modalForm.extra || 'Төв агуулах'], ...matrix]}); setIsIncomingModalOpen(false); }} className="bg-blue-600 text-white px-3 py-2 rounded-xl font-bold">Орлогодох</button>
                    </div>
                  </div>
                </div>
              )}

              {/* ЗАРЛАГА ГАРГАХ МОДАЛЬ ЦОНХ */}
              {isOutgoingModalOpen && (
                <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center p-4 z-50 text-xs">
                  <div className="bg-white rounded-2xl p-5 max-w-sm w-full shadow-2xl space-y-3">
                    <h4 className="font-bold text-sm">📤 Сэлбэгийн зарлага гаргах ({currentSheet})</h4>
                    <input type="text" placeholder="Сэлбэг хэрэгслийн нэрс" required value={modalForm.name} onChange={e => setModalForm({...modalForm, name: e.target.value})} className="w-full border p-2 rounded-xl" />
                    <input type="text" placeholder="Марка, марк дугаар" value={modalForm.code} onChange={e => setModalForm({...modalForm, code: e.target.value})} className="w-full border p-2 rounded-xl" />
                    <input type="number" placeholder="Зарлагадах тоо" required value={modalForm.qty} onChange={e => setModalForm({...modalForm, qty: e.target.value})} className="w-full border p-2 rounded-xl" />
                    <input type="text" placeholder="Хүлээлгэж өгсөн тасаг цех" value={modalForm.extra} onChange={e => setModalForm({...modalForm, extra: e.target.value})} className="w-full border p-2 rounded-xl" />
                    <div className="flex gap-2 justify-end">
                      <button onClick={() => setIsOutgoingModalOpen(false)} className="bg-slate-100 px-3 py-2 rounded-xl">Цуцлах</button>
                      <button onClick={() => { setSheets({...sheets, [currentSheet]: [[modalForm.name, modalForm.code || '---', 'ш', '0', '0', modalForm.qty, '0', modalForm.extra || 'Тасаг'], ...matrix]}); setIsOutgoingModalOpen(false); }} className="bg-orange-600 text-white px-3 py-2 rounded-xl font-bold">Зарлагадах</button>
                    </div>
                  </div>
                </div>
              )}

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<IntegratedExcelApp />);
    </script>
</body>
</html>
