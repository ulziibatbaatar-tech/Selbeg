<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мэргэжлийн Excel & Томьёоны Систем</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/hot-formula-parser@2.3.4/dist/formula-parser.min.js"></script>
    <style>
        .excel-table {
            border-collapse: collapse;
            table-layout: fixed;
        }
        .excel-table th, .excel-table td {
            border: 1px solid #cbd5e1;
            font-size: 13px;
            padding: 0;
        }
        .excel-table th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .excel-cell-container {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 32px;
        }
        .excel-cell-input {
            width: 100%;
            height: 100%;
            padding: 6px 8px;
            border: none;
            outline: none;
            background: transparent;
            font-family: inherit;
        }
        .excel-cell-input:focus {
            background-color: #ffffff;
            box-shadow: inset 0 0 0 2px #2563eb;
            z-index: 5;
        }
        /* Скролл бар */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Томьёо бодогч парсер үүсгэх
        const parser = new formulaParser.Parser();

        function FormulaExcelApp() {
          const [sheets, setSheets] = useState({
            "Сэлбэгийн Агуулах": Array(25).fill(null).map(() => Array(10).fill(''))
          });
          const [activeSheet, setActiveSheet] = useState("Сэлбэгийн Агуулах");
          
          // Аль нүдийг идэвхтэй засаж байгааг хянах төлөв (Орхисон үед томьёог бодож харуулна)
          const [editingCell, setEditingCell] = useState({ rIdx: null, cIdx: null });

          const currentGrid = sheets[activeSheet] || [];
          const colCount = currentGrid[0]?.length || 10;

          // Excel-ийн баганын А, B, C... хаягийг тоо руу, тоог хаяг руу хөрвүүлэх
          const getColumnLabel = (index) => {
            let label = '';
            while (index >= 0) {
              label = String.fromCharCode((index % 26) + 65) + label;
              index = Math.floor(index / 26) - 1;
            }
            return label;
          };

          // Томьёон доторх нүднүүдийн утгыг олох функцийг Парсерт бүртгэх
          parser.on('callCellValue', (cellCoord, done) => {
            const cIdx = cellCoord.column.index;
            const rIdx = cellCoord.row.index;
            
            const rawValue = currentGrid[rIdx]?.[cIdx];
            
            // Хэрэв тухайн нүд өөрөө томьёо байвал давхар бодно
            if (typeof rawValue === 'string' && rawValue.startsWith('=')) {
              const res = parser.parse(rawValue.substring(1));
              done(res.error ? 0 : parseFloat(res.result) || 0);
            } else {
              done(parseFloat(rawValue) || 0);
            }
          });

          // Нүдний утгыг харуулах ухаалаг функц (Томьёо бол бодно, текст бол хэвээр нь харуулна)
          const renderCellValue = (val, rIdx, cIdx) => {
            if (typeof val === 'string' && val.startsWith('=')) {
              // Хэрэв хэрэглэгч яг одоо засаж байгаа бол томьёог нь өөрийг нь харуулна
              if (editingCell.rIdx === rIdx && editingCell.cIdx === cIdx) {
                return val;
              }
              // Засаж дуусаад өөр газар дарсан бол томьёоны хариуг бодож гаргана
              const parsed = parser.parse(val.substring(1));
              if (parsed.error) return `<Алдаа: ${parsed.error}>`;
              return parsed.result;
            }
            return val;
          };

          // 📁 EXCEL / ODS ФАЙЛ УНШИХ
          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
              try {
                const bstr = evt.target.result;
                const wb = XLSX.read(bstr, { type: 'binary' });
                const newSheets = {};

                wb.SheetNames.forEach((sheetName) => {
                  const ws = wb.Sheets[sheetName];
                  const rawData = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
                  
                  while (rawData.length < 25) rawData.push(Array(rawData[0]?.length || 10).fill(''));
                  
                  const maxCols = Math.max(10, ...rawData.map(r => r.length));
                  const formattedData = rawData.map(row => {
                    const r = [...row];
                    while (r.length < maxCols) r.push('');
                    return r;
                  });
                  newSheets[sheetName] = formattedData;
                });

                setSheets(newSheets);
                setActiveSheet(wb.SheetNames[0]);
              } catch (error) {
                alert("Файлыг уншихад алдаа гарлаа.");
              }
            };
            reader.readAsBinaryString(file);
          };

          // 💾 EXCEL БОЛГОЖ ТАТАХ
          const exportToExcel = () => {
            const wb = XLSX.utils.book_new();
            Object.keys(sheets).forEach((sheetName) => {
              const ws = XLSX.utils.aoa_to_sheet(sheets[sheetName]);
              XLSX.utils.book_append_sheet(wb, ws, sheetName);
            });
            XLSX.writeFile(wb, "Best_Shoes_Татан_Авалт.xlsx");
          };

          // 📝 НҮДНИЙ УТГА ӨӨРЧЛӨХ
          const handleCellChange = (value, rIdx, cIdx) => {
            const currentData = [...sheets[activeSheet]];
            currentData[rIdx][cIdx] = value;
            setSheets({ ...sheets, [activeSheet]: currentData });
          };

          // Мөр, багана нэмэх хасах үйлдлүүд
          const addRow = () => {
            const currentData = [...sheets[activeSheet]];
            currentData.push(Array(colCount).fill(''));
            setSheets({ ...sheets, [activeSheet]: currentData });
          };

          const removeRow = () => {
            const currentData = [...sheets[activeSheet]];
            if (currentData.length > 1) {
              currentData.pop();
              setSheets({ ...sheets, [activeSheet]: currentData });
            }
          };

          const addColumn = () => {
            const currentData = sheets[activeSheet].map(row => [...row, '']);
            setSheets({ ...sheets, [activeSheet]: currentData });
          };

          const addNewSheet = () => {
            const sheetName = prompt("Шинэ хуудасны нэр:");
            if (!sheetName || sheets[sheetName]) return alert("Нэр буруу эсвэл бэлэн байна.");
            setSheets({
              ...sheets,
              [sheetName]: Array(25).fill(null).map(() => Array(10).fill(''))
            });
            setActiveSheet(sheetName);
          };

          return (
            <div className="flex flex-col h-screen bg-slate-100 select-none">
              
              {/* Дээд цэс */}
              <header className="bg-white border-b border-slate-200 p-3 px-6 flex flex-wrap items-center justify-between gap-4 shadow-xs">
                <div className="flex items-center gap-4">
                  <div className="bg-blue-600 text-white p-1.5 px-3 rounded-lg font-bold text-sm tracking-wider">EXCEL FORMULA PRO</div>
                  <div className="text-xs text-slate-400 font-medium bg-slate-100 p-1.5 rounded">
                     Жишээ томьёо бичих: <code className="bg-slate-200 p-0.5 rounded font-bold text-slate-700">=C1+D1</code> эсвэл <code className="bg-slate-200 p-0.5 rounded font-bold text-slate-700">=SUM(C1:C10)</code>
                  </div>
                  <div className="flex gap-1">
                    <button onClick={addRow} className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-2.5 py-1 rounded border border-slate-300 transition">+ Мөр</button>
                    <button onClick={removeRow} className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-2.5 py-1 rounded border border-slate-300 transition">- Мөр</button>
                    <button onClick={addColumn} className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-2.5 py-1 rounded border border-slate-300 transition">+ Багана</button>
                  </div>
                </div>

                <div className="flex items-center gap-3">
                  <label className="bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 font-medium text-xs py-1.5 px-4 rounded cursor-pointer transition">
                    📁 Файл уншуулах (.ods / .xlsx)
                    <input type="file" accept=".xlsx, .xls, .ods" onChange={handleFileUpload} className="hidden" />
                  </label>
                  <button onClick={exportToExcel} className="bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs py-1.5 px-4 rounded shadow transition">
                    💾 Excel татах
                  </button>
                </div>
              </header>

              {/* Хүснэгтийн үндсэн хэсэг */}
              <div className="flex-1 overflow-auto bg-white relative">
                <table className="excel-table w-full">
                  <thead>
                    <tr>
                      <th className="w-12 bg-slate-200 border border-slate-300 sticky left-0 z-20"></th>
                      {Array(colCount).fill(null).map((_, idx) => (
                        <th key={idx} className="w-40 border border-slate-300 bg-slate-100 text-xs font-normal text-slate-500 py-1">
                          {getColumnLabel(idx)}
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {currentGrid.map((row, rIdx) => (
                      <tr key={rIdx} className="hover:bg-slate-50/40">
                        <td className="bg-slate-100 text-center text-xs text-slate-400 font-medium border border-slate-300 sticky left-0 z-10 py-1">
                          {rIdx + 1}
                        </td>
                        {row.map((cell, cIdx) => (
                          <td key={cIdx} className="border border-slate-200 bg-white">
                            <div className="excel-cell-container">
                              <input 
                                type="text" 
                                // Хэрэв дарсан бол жинхэнэ утгыг/томьёог, өөр газар дарсан бол бодсон хариуг харуулна
                                value={editingCell.rIdx === rIdx && editingCell.cIdx === cIdx ? cell : renderCellValue(cell, rIdx, cIdx)} 
                                onFocus={() => setEditingCell({ rIdx, cIdx })}
                                onBlur={() => setEditingCell({ rIdx: null, cIdx: null })}
                                onChange={(e) => handleCellChange(e.target.value, rIdx, cIdx)}
                                className="excel-cell-input"
                              />
                            </div>
                          </td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              {/* Доод талын Шээт солих хэсэг */}
              <footer className="bg-slate-100 border-t border-slate-300 p-2 px-4 flex items-center justify-between">
                <div className="flex items-center gap-1 overflow-x-auto max-w-4xl">
                  {Object.keys(sheets).map((sheetName) => (
                    <div 
                      key={sheetName}
                      onClick={() => setActiveSheet(sheetName)}
                      className={`px-4 py-1.5 text-xs font-medium rounded-t-md border-x border-t cursor-pointer transition whitespace-nowrap ${activeSheet === sheetName ? 'bg-white text-blue-700 border-slate-300 font-semibold shadow-xs -mb-2 z-10' : 'bg-slate-200 text-slate-600 border-transparent hover:bg-slate-200/80'}`}
                    >
                      {sheetName}
                    </div>
                  ))}
                  <button onClick={addNewSheet} className="px-2.5 py-1 text-xs font-bold text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded transition ml-1">+</button>
                </div>
                <div className="text-[11px] text-slate-400 font-mono">
                  Идэвхтэй: {activeSheet}
                </div>
              </footer>

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FormulaExcelApp />);
    </script>
</body>
</html>
