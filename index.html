<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Агуулахын Систем</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function InventoryDashboard() {
          const [activeMenu, setActiveMenu] = useState('Хяналтын самбар');
          const [searchTerm, setSearchTerm] = useState('');
          const [isModalOpen, setIsModalOpen] = useState(false);

          // Шинэ орлого формын төлөвүүд
          const [newName, setNewName] = useState('');
          const [newCode, setNewCode] = useState('');
          const [newQty, setNewQty] = useState('');
          const [newSupplier, setNewSupplier] = useState('');

          // Агуулахын орлогын үндсэн дата (Анхны статик өгөгдөл)
          const [recentIncoming, setRecentIncoming] = useState([
            { name: 'Пүрш', code: 'SPR-001', qty: 120, supplier: 'Блю Стар ХХК' },
            { name: 'Боолт M10', code: 'BLT-010', qty: 500, supplier: 'Техно Импекс' },
            { name: 'LED гэрэл 50W', code: 'LED-050', qty: 30, supplier: 'Электро Сервис' },
          ]);

          const stats = [
            { title: 'Нийт бараа', value: recentIncoming.length },
            { title: 'Нийт үлдэгдэл', value: recentIncoming.reduce((sum, item) => sum + Number(item.qty), 0).toLocaleString() },
            { title: 'Өнөөдрийн орлого', value: '23' },
            { title: 'Өнөөдрийн зарлага', value: '18' },
          ];

          const recentOutgoing = [
            { name: 'Пүрш', code: 'SPR-001', qty: 20, department: 'Засварын хэсэг' },
            { name: 'Хошуувч', code: 'NOZ-005', qty: 5, department: 'Үйлдвэрлэл' },
            { name: 'Ажлын бээлий', code: 'GLV-002', qty: 10, department: 'Үйлдвэрлэл' },
          ];

          // 📂 EXCEL / ODS ФАЙЛ УНШИЖ ИМПОРТЛОХ ФУНКЦ
          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
              try {
                const bstr = evt.target.result;
                // Файлыг унших (Excel эсвэл ODS форматыг автоматаар танина)
                const wb = XLSX.read(bstr, { type: 'binary' });
                
                // Эхний хуудас (Sheet)-ийг авах
                const wsname = wb.SheetNames[0];
                const ws = wb.Sheets[wsname];
                
                // Хуудасны өгөгдлийг JSON формат руу хөрвүүлэх
                const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
                
                if (data.length < 2) {
                  alert("Файл хоосон байна эсвэл формат буруу байна.");
                  return;
                }

                // Эхний мөр нь баганын нэрс (Header) байна гэж тооцно: [Нэр, Код, Тоо, Нийлүүлэгч]
                const importedItems = [];
                for (let i = 1; i < data.length; i++) {
                  const row = data[i];
                  if (row[0]) { // Хэрэв нэр байвал жагсаалтад нэмнэ
                    importedItems.push({
                      name: row[0] || 'Нэргүй сэлбэг',
                      code: row[1] || 'КОДГҮЙ',
                      qty: parseInt(row[2]) || 0,
                      supplier: row[3] || 'Тодорхойгүй'
                    });
                  }
                }

                // Хуучин дата дээр шинэ импортолсон бараануудыг нэмэх
                setRecentIncoming([...importedItems, ...recentIncoming]);
                alert(`Амжилттай! ${importedItems.length} ш барааг файлаас импортоор авлаа.`);
                setActiveMenu('Хяналтын самбар'); // Шууд Хяналтын самбар руу шилжих
              } catch (error) {
                console.error(error);
                alert("Файлыг уншихад алдаа гарлаа. Файлын бүтэц зөв эсэхийг шалгана уу.");
              }
            };
            reader.readAsBinaryString(file);
          };

          // Гар аргаар шинэ орлого нэмэх функц
          const handleAddIncoming = (e) => {
            e.preventDefault();
            if (!newName || !newCode || !newQty || !newSupplier) return alert('Бүх талбарыг бөглөнө үү!');

            const newItem = {
              name: newName, code: newCode, qty: parseInt(newQty), supplier: newSupplier
            };

            setRecentIncoming([newItem, ...recentIncoming]);
            setIsModalOpen(false);
            setNewName(''); setNewCode(''); setNewQty(''); setNewSupplier('');
          };

          // Хайлтаар шүүх
          const filteredIncoming = recentIncoming.filter(item => 
            item.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
            item.code.toLowerCase().includes(searchTerm.toLowerCase()) ||
            item.supplier.toLowerCase().includes(searchTerm.toLowerCase())
          );

          return (
            <div className="min-h-screen bg-slate-100 flex">
              {/* Sidebar */}
              <aside className="w-72 bg-slate-900 text-white p-6 hidden md:block">
                <div className="mb-10">
                  <h1 className="text-2xl font-bold">АГУУЛАХ СИСТЕМ</h1>
                  <p className="text-slate-400 text-sm mt-2">Дотоод удирдлагын систем</p>
                </div>

                <nav className="space-y-3">
                  {[
                    'Хяналтын самбар', 'Сэлбэгийн бүртгэл', 'Орлого', 'Зарлага', 
                    'Үлдэгдэл', 'ХАБЭА бүртгэл', 'Тайлан', 'Excel / ODS импорт', 
                    'Хэрэглэгчид', 'Тохиргоо'
                  ].map((item) => (
                    <div 
                      key={item} 
                      onClick={() => setActiveMenu(item)}
                      className={`p-3 rounded-xl cursor-pointer transition ${activeMenu === item ? 'bg-blue-600 text-white font-medium' : 'hover:bg-slate-800 text-slate-300'}`}
                    >
                      {item}
                    </div>
                  ))}
                </nav>
              </aside>

              {/* Main Content */}
              <main className="flex-1 p-6">
                {/* Header */}
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                  <div>
                    <h2 className="text-3xl font-bold text-slate-800">{activeMenu}</h2>
                    <p className="text-slate-500 mt-1">Агуулахын бодит мэдээлэл</p>
                  </div>
                  <div className="flex gap-3 w-full md:w-auto">
                    <input 
                      type="text" 
                      placeholder="Нэр, кодоор хайх..." 
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="px-4 py-3 rounded-xl border border-slate-300 w-full md:w-80 bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" 
                    />
                    <button 
                      onClick={() => setIsModalOpen(true)}
                      className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-xl font-medium shadow-sm transition active:scale-95"
                    >
                      + Шинэ орлого
                    </button>
                  </div>
                </div>

                {/* 📂 EXCEL / ODS ИМПОРТ ХИЙХ ХУУДАС */}
                {activeMenu === 'Excel / ODS импорт' ? (
                  <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm max-w-2xl mx-auto">
                    <h3 className="text-xl font-bold text-slate-800 mb-2">Excel эсвэл ODS файлаас дата унших</h3>
                    <p className="text-slate-500 text-sm mb-6">Агуулахын сэлбэг, барааны жагсаалт бүхий файлаа оруулна уу. Файлын баганын бүтэц дарааллаараа: [Нэр, Код, Тоо, Нийлүүлэгч] байхыг анхаарна уу.</p>
                    
                    <div className="border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-2xl p-10 text-center cursor-pointer transition bg-slate-50 relative">
                      <input 
                        type="file" 
                        accept=".xlsx, .xls, .ods" 
                        onChange={handleFileUpload}
                        className="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
                      />
                      <div className="space-y-2">
                        <span className="text-4xl">📊</span>
                        <p className="font-medium text-slate-700">Файлаа сонгох эсвэл энд чирч авчирна уу</p>
                        <p className="text-xs text-slate-400">Зөвхөн .xlsx, .xls, .ods өргөтгөлтэй файлууд</p>
                      </div>
                    </div>
                  </div>
                ) : activeMenu !== 'Хяналтын самбар' ? (
                  <div className="bg-white p-12 rounded-2xl border border-slate-200 text-center text-slate-500">
                     {activeMenu} хуудас хөгжүүлэлтийн шатанд байна.
                  </div>
                ) : (
                  <>
                    {/* Stats */}
                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-5 mb-8">
                      {stats.map((stat) => (
                        <div key={stat.title} className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                          <p className="text-slate-500 text-sm">{stat.title}</p>
                          <h3 className="text-4xl font-bold mt-3 text-slate-800">{stat.value}</h3>
                        </div>
                      ))}
                    </div>

                    {/* Inventory Section */}
                    <div className="grid grid-cols-1 xl:grid-cols-2 gap-6 mb-8">
                      {/* Сүүлийн орлогууд */}
                      <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                        <div className="flex justify-between items-center mb-5">
                          <h3 className="text-xl font-bold text-slate-800">Сүүлийн орлогууд</h3>
                          <button className="text-blue-600 font-medium hover:underline">Бүгдийг харах</button>
                        </div>
                        <div className="overflow-x-auto">
                          <table className="w-full">
                            <thead>
                              <tr className="text-left border-b border-slate-200 text-slate-600">
                                <th className="pb-3">Нэр</th>
                                <th className="pb-3">Код</th>
                                <th className="pb-3">Тоо</th>
                                <th className="pb-3">Нийлүүлэгч</th>
                              </tr>
                            </thead>
                            <tbody>
                              {filteredIncoming.length > 0 ? filteredIncoming.map((item, index) => (
                                <tr key={index} className="border-b border-slate-100 hover:bg-slate-50 transition">
                                  <td className="py-4 font-medium text-slate-800">{item.name}</td>
                                  <td className="py-4 text-slate-600">{item.code}</td>
                                  <td className="py-4 font-semibold text-blue-600">+{item.qty}</td>
                                  <td className="py-4 text-slate-600">{item.supplier}</td>
                                </tr>
                              )) : (
                                <tr>
                                  <td colSpan="4" className="text-center py-6 text-slate-400">Бараа олдсонгүй.</td>
                                </tr>
                              )}
                            </tbody>
                          </table>
                        </div>
                      </div>

                      {/* Сүүлийн зарлагууд */}
                      <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                        <div className="flex justify-between items-center mb-5">
                          <h3 className="text-xl font-bold text-slate-800">Сүүлийн зарлагууд</h3>
                          <button className="text-blue-600 font-medium hover:underline">Бүгдийг харах</button>
                        </div>
                        <div className="overflow-x-auto">
                          <table className="w-full">
                            <thead>
                              <tr className="text-left border-b border-slate-200 text-slate-600">
                                <th className="pb-3">Нэр</th>
                                <th className="pb-3">Код</th>
                                <th className="pb-3">Тоо</th>
                                <th className="pb-3">Хэлтэс</th>
                              </tr>
                            </thead>
                            <tbody>
                              {recentOutgoing.map((item, index) => (
                                <tr key={index} className="border-b border-slate-100 hover:bg-slate-50 transition">
                                  <td className="py-4 font-medium text-slate-800">{item.name}</td>
                                  <td className="py-4 text-slate-600">{item.code}</td>
                                  <td className="py-4 font-semibold text-orange-600">-{item.qty}</td>
                                  <td className="py-4 text-slate-600">{item.department}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  </>
                )}
              </main>

              {/* ХОП-АП ФОРМ */}
              {isModalOpen && (
                <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                  <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-xl">
                    <h3 className="text-xl font-bold text-slate-800 mb-4">Шинэ орлого бүртгэх</h3>
                    <form onSubmit={handleAddIncoming} className="space-y-4">
                      <div>
                        <label className="block text-sm font-medium text-slate-600 mb-1">Сэлбэг, барааны нэр</label>
                        <input type="text" value={newName} onChange={(e) => setNewName(e.target.value)} className="w-full border border-slate-300 rounded-xl px-4 py-2" placeholder="Жишээ: Ажлын бээлий" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-600 mb-1">Дотоод код</label>
                        <input type="text" value={newCode} onChange={(e) => setNewCode(e.target.value)} className="w-full border border-slate-300 rounded-xl px-4 py-2" placeholder="Жишээ: GLV-002" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-600 mb-1">Тоо ширхэг</label>
                        <input type="number" value={newQty} onChange={(e) => setNewQty(e.target.value)} className="w-full border border-slate-300 rounded-xl px-4 py-2" placeholder="0" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-600 mb-1">Нийлүүлэгч компани</label>
                        <input type="text" value={newSupplier} onChange={(e) => setNewSupplier(e.target.value)} className="w-full border border-slate-300 rounded-xl px-4 py-2" placeholder="Жишээ: Алтан Түлхүүр ХХК" />
                      </div>
                      <div className="flex gap-3 pt-2 justify-end">
                        <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded-xl text-slate-700 font-medium">Цуцлах</button>
                        <button type="submit" className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium">Хадгалах</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<InventoryDashboard />);
    </script>
</body>
</html>
