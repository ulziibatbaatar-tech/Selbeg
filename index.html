<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best Shoes - Агуулахын Олон Хуудаст Ухаалаг Систем</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        /* Excel нүдний загвар */
        .excel-cell {
            border: 1px solid #cbd5e1;
            padding: 0;
            min-width: 130px;
            height: 34px;
            position: relative;
            user-select: none;
        }
        .excel-input {
            width: 100%;
            height: 100%;
            padding: 6px 10px;
            border: none;
            outline: none;
            background: transparent;
            font-size: 13px;
            color: #334155;
        }
        /* Идэвхжүүлсэн (Selected) нүдний цэнхэр стайл */
        .cell-selected {
            background-color: rgba(14, 165, 233, 0.15) !important;
            box-shadow: inset 0 0 0 1px #0ea5e9;
        }
        /* Одоогийн фокустай байгаа нүд */
        .excel-input:focus {
            background-color: #ffffff;
            box-shadow: inset 0 0 0 2px #16a34a;
            z-index: 10;
        }
        /* Баруун товчны цэс */
        .excel-context-menu {
            position: absolute;
            z-index: 9999;
            background: white;
            border: 1px solid #cbd5e1;
            box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.1);
            border-radius: 8px;
            padding: 6px;
            width: 210px;
            font-size: 13px;
        }
        .excel-context-menu button {
            width: 100%;
            text-align: left;
            padding: 6px 12px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .excel-context-menu button:hover {
            background-color: #f1f5f9;
        }
    </style>
</head>
<body class="bg-slate-100 antialiased text-slate-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function IntegratedExcelApp() {
          // --- 1. НЭВТРЭХ СИСТЕМ ---
          const [isLoggedIn, setIsLoggedIn] = useState(false);
          const [password, setPassword] = useState('');
          const [systemPassword, setSystemPassword] = useState('9761'); 
          const [newPasswordInput, setNewPasswordInput] = useState('');

          // --- 2. НАВИГАЦИ & ХАЙЛТ ---
          const [activeMenu, setActiveMenu] = useState('Сэлбэгийн бүртгэл');
          const [searchTerm, setSearchTerm] = useState('');
          
          // --- 3. САРУУДЫН ШЭЭТ (SHEETS) УДИРДЛАГА ---
          const [currentSheet, setCurrentSheet] = useState('2026-01');
          const [sheets, setSheets] = useState({
            '2026-01': [
              ['Пүрш', 'SPR-001', '120', '20', '100', 'Блю Стар ХХК'],
              ['Боолт M10', 'BLT-010', '500', '50', '450', 'Техно Импекс']
            ],
            '2026-02': [
              ['LED гэрэл 50W', 'LED-050', '30', '0', '30', 'Электро Сервис'],
              ['Ажлын бээлий', 'GLV-002', '200', '15', '185', 'Дотоод Сорс']
            ],
            '2026-03': [
              ['Пүрш', 'SPR-001', '50', '10', '40', 'Блю Стар ХХК']
            ],
            '2026-04': [],
            '2026-05': []
          });

          // Баганы тогтвортой бүтэц
          const [headers, setHeaders] = useState([
            { id: 'h1', label: 'Барааны нэр', visible: true },
            { id: 'h2', label: 'Материалын код', visible: true },
            { id: 'h3', label: 'Орлого (Тоо)', visible: true },
            { id: 'h4', label: 'Зарлага (Тоо)', visible: true },
            { id: 'h5', label: 'Үлдэгдэл', visible: true },
            { id: 'h6', label: 'Нийлүүлэгч / Тасаг', visible: true }
          ]);

          // --- 4. ХУЛГАНААР ИДЭВХЖҮҮЛЭХ (SELECTION) ---
          const [isSelecting, setIsSelecting] = useState(false);
          const [selectionStart, setSelectionStart] = useState(null); 
          const [selectionEnd, setSelectionEnd] = useState(null);     
          const [selectAll, setSelectAll] = useState(false);

          // --- 5. БАРУУН ТОВЧНЫ ЦЭС ---
          const [contextMenu, setContextMenu] = useState({ visible: false, x: 0, y: 0, rIdx: null, cIdx: null });

          // Орлого / Зарлагын модаль цонх
          const [isIncomingModalOpen, setIsIncomingModalOpen] = useState(false);
          const [isOutgoingModalOpen, setIsOutgoingModalOpen] = useState(false);
          const [modalForm, setModalForm] = useState({ name: '', code: '', qty: '', extra: '' });

          // Одоогийн идэвхтэй байгаа сарын өгөгдөл
          const matrix = sheets[currentSheet] || [];

          // Автомат Үлдэгдэл бодох томьёо (Сар бүрийн Sheet дээр ажиллана)
          useEffect(() => {
            const currentData = sheets[currentSheet];
            if (!currentData) return;

            const updated = currentData.map(row => {
              const inc = parseFloat(row[2]) || 0;
              const out = parseFloat(row[3]) || 0;
              const rem = inc - out;
              const newRow = [...row];
              if(newRow.length > 4) {
                newRow[4] = rem.toString();
              }
              return newRow;
            });

            if (JSON.stringify(updated) !== JSON.stringify(currentData)) {
              setSheets({
                ...sheets,
                [currentSheet]: updated
              });
            }
          }, [matrix, currentSheet]);

          // Шинэ сар (Sheet) нэмэх функц
          const addNewMonthSheet = () => {
            const monthName = prompt("Үүсгэх сарын нэрийг оруулна уу (Жишээ нь: 2026-06):", "2026-06");
            if (!monthName) return;
            if (sheets[monthName]) {
              alert("Энэ сарын хуудас аль хэдийн үүссэн байна!");
              return;
            }
            setSheets({
              ...sheets,
              [monthName]: []
            });
            setCurrentSheet(monthName);
          };

          // Нэвтрэх логик
          const handleLogin = (e) => {
            e.preventDefault();
            if (password === systemPassword) setIsLoggedIn(true);
            else alert('Нууц үг буруу байна!');
          };

          // Код солих
          const handlePasswordChange = (e) => {
            e.preventDefault();
            if (newPasswordInput.trim().length > 0) {
              setSystemPassword(newPasswordInput.trim());
              alert(`Нууц үг солигдлоо: ${newPasswordInput.trim()}`);
              setNewPasswordInput('');
            }
          };

          // --- ХУЛГАНААР ИДЭВХЖҮҮЛЭХ ---
          const handleMouseDown = (rIdx, cIdx, e) => {
            if (e.button === 2) return; 
            setSelectAll(false);
            setIsSelecting(true);
            setSelectionStart({ r: rIdx, c: cIdx });
            setSelectionEnd({ r: rIdx, c: cIdx });
          };

          const handleMouseEnter = (rIdx, cIdx) => {
            if (!isSelecting) return;
            setSelectionEnd({ r: rIdx, c: cIdx });
          };

          const isCellSelected = (rIdx, cIdx) => {
            if (selectAll) return true;
            if (!selectionStart || !selectionEnd) return false;
            const startR = Math.min(selectionStart.r, selectionEnd.r);
            const endR = Math.max(selectionStart.r, selectionEnd.r);
            const startC = Math.min(selectionStart.c, selectionEnd.c);
            const endC = Math.max(selectionStart.c, selectionEnd.c);
            return rIdx >= startR && rIdx <= endR && cIdx >= startC && cIdx <= endC;
          };

          const handleInputChange = (value, rIdx, cIdx) => {
            const updatedMatrix = [...matrix];
            if (!updatedMatrix[rIdx]) updatedMatrix[rIdx] = Array(headers.length).fill('');
            updatedMatrix[rIdx][cIdx] = value;
            setSheets({ ...sheets, [currentSheet]: updatedMatrix });
          };

          // --- БАРУУН ТОВЧНЫ ЦЭСНИЙ ҮЙЛДЛҮҮД ---
          const handleCellContextMenu = (e, rIdx, cIdx) => {
            e.preventDefault();
            setContextMenu({ visible: true, x: e.pageX, y: e.pageY, rIdx, cIdx });
          };

          const insertRow = (direction) => {
            const { rIdx } = contextMenu;
            if (rIdx === null) return;
            const newRow = Array(headers.length).fill('');
            const updated = [...matrix];
            updated.splice(direction === 'above' ? rIdx : rIdx + 1, 0, newRow);
            setSheets({ ...sheets, [currentSheet]: updated });
            setContextMenu({ ...contextMenu, visible: false });
          };

          const deleteRow = () => {
            const { rIdx } = contextMenu;
            if (rIdx === null || matrix.length === 0) return;
            const updated = [...matrix];
            updated.splice(rIdx, 1);
            setSheets({ ...sheets, [currentSheet]: updated });
            setContextMenu({ ...contextMenu, visible: false });
          };

          const insertColumn = (direction) => {
            const { cIdx } = contextMenu;
            if (cIdx === null) return;
            const label = prompt("Шинэ баганын нэр:");
            if (!label) return;
            const targetIdx = direction === 'left' ? cIdx : cIdx + 1;
            
            const updatedHeaders = [...headers];
            updatedHeaders.splice(targetIdx, 0, { id: 'col_' + Date.now(), label, visible: true });
            setHeaders(updatedHeaders);

            const updatedSheets = { ...sheets };
            Object.keys(updatedSheets).forEach(key => {
              updatedSheets[key] = updatedSheets[key].map(row => {
                const r = [...row];
                r.splice(targetIdx, 0, '');
                return r;
              });
            });
            setSheets(updatedSheets);
            setContextMenu({ ...contextMenu, visible: false });
          };

          const deleteColumn = () => {
            const { cIdx } = contextMenu;
            if (cIdx === null) return;
            const updatedHeaders = [...headers];
            updatedHeaders.splice(cIdx, 1);
            setHeaders(updatedHeaders);

            const updatedSheets = { ...sheets };
            Object.keys(updatedSheets).forEach(key => {
              updatedSheets[key] = updatedSheets[key].map(row => {
                const r = [...row];
                r.splice(cIdx, 1);
                return r;
              });
            });
            setSheets(updatedSheets);
            setContextMenu({ ...contextMenu, visible: false });
          };

          const hideCurrentColumn = () => {
            const { cIdx } = contextMenu;
            if (cIdx === null) return;
            const updated = [...headers];
            updated[cIdx].visible = false;
            setHeaders(updated);
            setContextMenu({ ...contextMenu, visible: false });
          };

          // Модаль үйлдэл
          const submitIncoming = (e) => {
            e.preventDefault();
            const newRow = [modalForm.name, modalForm.code || '---', modalForm.qty, '0', modalForm.qty, modalForm.extra || 'Бүртгэл'];
            setSheets({ ...sheets, [currentSheet]: [newRow, ...matrix] });
            setIsIncomingModalOpen(false);
            setModalForm({ name: '', code: '', qty: '', extra: '' });
          };

          const submitOutgoing = (e) => {
            e.preventDefault();
            const newRow = [modalForm.name, modalForm.code || '---', '0', modalForm.qty, '0', modalForm.extra || 'Тасаг'];
            setSheets({ ...sheets, [currentSheet]: [newRow, ...matrix] });
            setIsOutgoingModalOpen(false);
            setModalForm({ name: '', code: '', qty: '', extra: '' });
          };

          // Нийт тооцоолол
          const totalIn = matrix.reduce((s, r) => s + (parseFloat(r[2]) || 0), 0);
          const totalOut = matrix.reduce((s, r) => s + (parseFloat(r[3]) || 0), 0);
          const totalStock = matrix.reduce((s, r) => s + (parseFloat(r[4]) || 0), 0);

          if (!isLoggedIn) {
            return (
              <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center space-y-5">
                  <h1 className="text-2xl font-black text-slate-800 tracking-wider">BEST SHOES</h1>
                  <p className="text-slate-400 text-xs">Агуулахын сар бүрийн нэгдсэн тайлан</p>
                  <form onSubmit={handleLogin} className="space-y-4">
                    <input 
                      type="password" 
                      placeholder="Нууц үг оруулна уу" 
                      required 
                      value={password} 
                      onChange={(e) => setPassword(e.target.value)} 
                      className="w-full border p-3 rounded-xl text-sm outline-none focus:border-blue-500" 
                    />
                    <button type="submit" className="w-full bg-slate-900 text-white font-bold p-3 rounded-xl text-sm shadow-md">Систем рүү нэвтрэх</button>
                  </form>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen flex bg-slate-100" onClick={() => setContextMenu({ ...contextMenu, visible: false })} onMouseUp={() => setIsSelecting(false)}>
              
              {/* ЗҮҮН ТАЛЫН ХАР ЦЭС */}
              <aside className="w-64 bg-slate-900 text-white p-6 hidden md:flex flex-col shadow-xl select-none">
                <div className="mb-8">
                  <h1 className="text-xl font-bold tracking-wider text-blue-400">BEST SHOES</h1>
                  <p className="text-slate-400 text-xs mt-0.5">Үйлдвэрлэл & Тайлан</p>
                </div>
                <nav className="space-y-1 flex-1">
                  {[{ name: 'Сэлбэгийн бүртгэл', icon: '🔧' }, { name: 'Тохиргоо', icon: '⚙️' }].map((item) => (
                    <div 
                      key={item.name} 
                      onClick={() => setActiveMenu(item.name)}
                      className={`p-3 rounded-xl cursor-pointer transition flex items-center gap-3 text-sm font-medium ${activeMenu === item.name ? 'bg-blue-600 text-white shadow-md' : 'hover:bg-slate-800 text-slate-300'}`}
                    >
                      <span>{item.icon}</span><span>{item.name}</span>
                    </div>
                  ))}
                </nav>
                <div className="pt-4 border-t border-slate-800">
                  <button onClick={() => setIsLoggedIn(false)} className="w-full bg-slate-800 hover:bg-red-950 text-slate-300 hover:text-red-300 text-xs py-2 rounded-lg transition font-medium">🚪 Гарах</button>
                </div>
              </aside>

              {/* БАРУУН ТАЛЫН ҮНДСЭН АЖЛЫН ХЭСЭГ */}
              <main className="flex-1 p-6 overflow-y-auto flex flex-col justify-between">
                <div>
                  {/* ДЭЭД ХАЙЛТ, ТОХИРГОО */}
                  <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <div>
                      <h2 className="text-xl font-bold text-slate-800">{activeMenu} ({currentSheet} сар)</h2>
                      <p className="text-slate-400 text-xs mt-0.5">Доороос саруудаа сонгож шинэ хуудас үүсгэж ажиллана уу.</p>
                    </div>
                    <div className="flex flex-wrap gap-2 w-full md:w-auto">
                      <button onClick={() => setIsIncomingModalOpen(true)} className="bg-blue-600 text-white px-3 py-2 rounded-xl text-xs font-semibold shadow">+ Орлого</button>
                      <button onClick={() => setIsOutgoingModalOpen(true)} className="bg-orange-600 text-white px-3 py-2 rounded-xl text-xs font-semibold shadow">- Зарлага</button>
                    </div>
                  </div>

                  {activeMenu === 'Сэлбэгийн бүртгэл' && (
                    <>
                      {/* НЭГДҮҮЛСЭН МЭДЭЭЛЭЛ */}
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
                        <div className="bg-white p-4 rounded-xl border border-slate-200 text-center">
                          <p className="text-slate-400 text-xs font-bold uppercase">{currentSheet} Нийт Орлого</p>
                          <h3 className="text-xl font-black mt-1 text-blue-600">{totalIn.toLocaleString()} ш</h3>
                        </div>
                        <div className="bg-white p-4 rounded-xl border border-slate-200 text-center">
                          <p className="text-slate-400 text-xs font-bold uppercase">{currentSheet} Нийт Зарлага</p>
                          <h3 className="text-xl font-black mt-1 text-orange-600">{totalOut.toLocaleString()} ш</h3>
                        </div>
                        <div className="bg-white p-4 rounded-xl border border-slate-200 text-center">
                          <p className="text-slate-400 text-xs font-bold uppercase">{currentSheet} Сарын Үлдэгдэл</p>
                          <h3 className="text-xl font-black mt-1 text-emerald-600">{totalStock.toLocaleString()} ш</h3>
                        </div>
                      </div>

                      {/* ЖИНХЕНЭ EXCEL ХҮСНЭГТ */}
                      <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                        <div className="flex justify-end mb-2">
                          <button onClick={() => setHeaders(headers.map(h => ({ ...h, visible: true })))} className="text-xs text-blue-600 hover:underline font-bold">👁️ Нуусан багануудыг гаргах (Unhide All)</button>
                        </div>
                        <div className="overflow-x-auto border border-slate-200 rounded-xl relative">
                          <table className="w-full text-left border-collapse" style={{ tableLayout: 'fixed' }}>
                            <thead>
                              <tr className="bg-slate-50 select-none">
                                <th onClick={() => setSelectAll(!selectAll)} className="border p-2 text-xs text-slate-400 bg-slate-100 text-center cursor-pointer w-12">◤</th>
                                {headers.map((h, idx) => h.visible && (
                                  <th key={h.id} onContextMenu={(e) => handleCellContextMenu(e, null, idx)} className="border p-2.5 text-xs font-bold text-slate-600 bg-slate-100 truncate">
                                    {h.label}
                                  </th>
                                ))}
                              </tr>
                            </thead>
                            <tbody>
                              {matrix.map((row, rIdx) => (
                                <tr key={rIdx}>
                                  <td onContextMenu={(e) => handleCellContextMenu(e, rIdx, null)} className="border p-2 text-xs text-slate-400 text-center bg-slate-50 font-medium select-none">{rIdx + 1}</td>
                                  {row.map((cell, cIdx) => headers[cIdx]?.visible && (
                                    <td 
                                      key={cIdx} 
                                      onMouseDown={(e) => handleMouseDown(rIdx, cIdx, e)}
                                      onMouseEnter={() => handleMouseEnter(rIdx, cIdx)}
                                      onContextMenu={(e) => handleCellContextMenu(e, rIdx, cIdx)}
                                      className={`excel-cell ${isCellSelected(rIdx, cIdx) ? 'cell-selected' : ''}`}
                                    >
                                      <input 
                                        type="text" 
                                        value={cell || ''} 
                                        onChange={(e) => handleInputChange(e.target.value, rIdx, cIdx)}
                                        className="excel-input"
                                      />
                                    </td>
                                  ))}
                                </tr>
                              ))}
                              {/* Хэрэв мөр байхгүй бол хоосон заавар */}
                              {matrix.length === 0 && (
                                <tr>
                                  <td colSpan={headers.length + 1} className="text-center p-8 text-xs text-slate-400">Энэ сард бүртгэл байхгүй байна. Баруун товч даран мөр нэмж эсвэл Орлого/Зарлага хийнэ үү.</td>
                                </tr>
                              )}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </>
                  )}

                  {/* ТОХИРГОО ЦЭС */}
                  {activeMenu === 'Тохиргоо' && (
                    <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm max-w-md space-y-4">
                      <h4 className="font-bold text-slate-800 text-base">🔐 Системийн код засах</h4>
                      <form onSubmit={handlePasswordChange} className="space-y-4 text-xs">
                        <input type="text" placeholder="Шинэ код оруулна уу..." value={newPasswordInput} onChange={(e) => setNewPasswordInput(e.target.value)} className="w-full border p-2.5 rounded-xl outline-none" required />
                        <button type="submit" className="bg-blue-600 text-white font-bold px-4 py-2.5 rounded-xl shadow">Хадгалах</button>
                      </form>
                    </div>
                  )}
                </div>

                {/* 📊 ДООД ТАЛЫН УХААЛАГ EXCEL SHEET ТАБУУД (САР СУУРЬТАЙ) */}
                {activeMenu === 'Сэлбэгийн бүртгэл' && (
                  <div className="mt-4 bg-white p-2.5 border border-slate-200 rounded-xl flex items-center flex-wrap gap-1 select-none shadow-sm">
                    <span className="text-xs font-bold text-slate-400 px-2 uppercase tracking-wider">Хуудаснууд (Sheets):</span>
                    <div className="flex flex-wrap gap-1">
                      {Object.keys(sheets).sort().map((sheetName) => (
                        <button
                          key={sheetName}
                          onClick={() => { setCurrentSheet(sheetName); setSelectAll(false); }}
                          className={`text-xs px-4 py-1.5 rounded-lg font-bold border transition ${currentSheet === sheetName ? 'bg-blue-50 text-blue-600 border-blue-200 shadow-xs' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'}`}
                        >
                          📄 {sheetName}
                        </button>
                      ))}
                    </div>
                    <button 
                      onClick={addNewMonthSheet}
                      className="bg-slate-900 hover:bg-slate-800 text-white text-xs px-3 py-1.5 rounded-lg font-bold transition flex items-center gap-1 shadow-xs ml-auto"
                    >
                      ➕ Шинэ сар (Sheet) нэмэх
                    </button>
                  </div>
                )}
              </main>

              {/* 🖱️ БАРУУН ТОВЧНЫ EXCEL ЦЭС */}
              {contextMenu.visible && (
                <div className="excel-context-menu" style={{ top: contextMenu.y, left: contextMenu.x }} onClick={(e) => e.stopPropagation()}>
                  <button onClick={() => insertRow('above')} className="text-slate-700">➕ Дээр мөр нэмэх</button>
                  <button onClick={() => insertRow('below')} className="text-slate-700">➕ Доор мөр нэмэх</button>
                  <button onClick={deleteRow} className="text-red-600 hover:bg-red-50">❌ Энэ мөрийг устгах</button>
                  <hr className="my-1 border-slate-200" />
                  <button onClick={() => insertColumn('left')} className="text-slate-700">📐 Зүүн талд багана нэмэх</button>
                  <button onClick={() => insertColumn('right')} className="text-slate-700">📐 Баруун талд багана нэмэх</button>
                  <button onClick={deleteColumn} className="text-red-600 hover:bg-red-50">🗑️ Энэ баганыг устгах</button>
                  <hr className="my-1 border-slate-200" />
                  <button onClick={hideCurrentColumn} className="text-slate-500 font-medium">👁️‍🗨️ Баганыг нуух (Hide)</button>
                </div>
              )}

              {/* ОРЛОГЫН МОДАЛЬ */}
              {isIncomingModalOpen && (
                <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center p-4 z-50 backdrop-blur-xs">
                  <div className="bg-white rounded-2xl p-5 max-w-sm w-full shadow-2xl text-xs">
                    <h4 className="font-bold text-slate-800 text-sm mb-3">📥 Шинэ орлого бүртгэх ({currentSheet})</h4>
                    <form onSubmit={submitIncoming} className="space-y-3">
                      <div><label className="block mb-1 font-medium">Барааны нэр *</label><input type="text" required value={modalForm.name} onChange={e => setModalForm({...modalForm, name: e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                      <div><label className="block mb-1 font-medium">Код</label><input type="text" value={modalForm.code} onChange={e => setModalForm({...modalForm, code: e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                      <div><label className="block mb-1 font-medium">Тоо ширхэг *</label><input type="number" required value={modalForm.qty} onChange={e => setModalForm({...modalForm, qty: e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                      <div><label className="block mb-1 font-medium">Нийлүүлэгч</label><input type="text" value={modalForm.extra} onChange={e => setModalForm({...modalForm, extra: e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                      <div className="flex gap-2 justify-end pt-2">
                        <button type="button" onClick={() => setIsIncomingModalOpen(false)} className="bg-slate-100 px-3 py-2 rounded-xl">Цуцлах</button>
                        <button type="submit" className="bg-blue-600 text-white px-3 py-2 rounded-xl font-bold">Орлогодох</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {/* ЗАРЛАГЫН МОДАЛЬ */}
              {isOutgoingModalOpen && (
                <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center p-4 z-50 backdrop-blur-xs">
                  <div className="bg-white rounded-2xl p-5 max-w-sm w-full shadow-2xl text-xs">
                    <h4 className="font-bold text-slate-800 text-sm mb-3">📤 Зарлагын хуудас үүсгэх ({currentSheet})</h4>
                    <form onSubmit={submitOutgoing} className="space-y-3">
                      <div><label className="block mb-1 font-medium">Барааны нэр *</label><input type="text" required value={modalForm.name} onChange={e => setModalForm({...modalForm, name: e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                      <div><label className="block mb-1 font-medium">Код</label><input type="text" value={modalForm.code} onChange={e => setModalForm({...modalForm, code: e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                      <div><label className="block mb-1 font-medium">Тоо ширхэг *</label><input type="number" required value={modalForm.qty} onChange={e => setModalForm({...modalForm, qty: e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                      <div><label className="block mb-1 font-medium">Тасаг хэлтэс</label><input type="text" value={modalForm.extra} onChange={e => setModalForm({...modalForm, extra: e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                      <div className="flex gap-2 justify-end pt-2">
                        <button type="button" onClick={() => setIsOutgoingModalOpen(false)} className="bg-slate-100 px-3 py-2 rounded-xl">Цуцлах</button>
                        <button type="submit" className="bg-orange-600 text-white px-3 py-2 rounded-xl font-bold">Зарлагадах</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<IntegratedExcelApp />);
    </script>
</body>
</html>
